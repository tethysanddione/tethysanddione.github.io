<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Star & Planet System Generator</title>
    <style>
        :root {
            --bg-color: #1a1e23;
            --panel-bg: #2a2f36;
            --text-color: #e0e6ec;
            --header-color: #ffffff;
            --border-color: #404853;
            --accent-color: #00aaff;
            --accent-hover: #0088cc;
            --green-color: #28a745;
            --red-color: #dc3545;
            --orange-color: #fd7e14;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }
        .generator-panel {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border-color);
            flex: 1;
            min-width: 400px;
            display: flex;
            flex-direction: column;
        }
        h1, h2 {
            color: var(--header-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 0;
        }
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .lang-switcher button {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .lang-switcher button.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
            flex-grow: 1;
        }
        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--accent-hover);
        }
        .btn-secondary {
            background-color: var(--green-color);
            color: white;
        }
        .btn-secondary:hover {
            background-color: #1e7e34;
        }
        .btn-danger {
            background-color: var(--orange-color);
            color: white;
        }
        .btn-danger:hover {
            background-color: #d8680c;
        }
        .output-area {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', Courier, monospace;
            flex-grow: 1;
            overflow-y: auto;
            min-height: 200px;
        }
        .description-area {
            background-color: transparent;
            border: none;
            padding: 0 15px 15px 15px;
            font-style: italic;
            color: #a0a8b1;
        }
        .planet-preview {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        #orbitCanvas {
            background-color: #000;
            border-radius: 5px;
            width: 100%;
            aspect-ratio: 16 / 9;
            cursor: grab;
        }
        #orbitCanvas:active {
            cursor: grabbing;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: #3c424a;
            color: var(--text-color);
            box-sizing: border-box;
        }
        #savedPlanetsContainer .planet-entry {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            margin-top: 15px;
            padding: 10px;
        }
        #savedPlanetsContainer h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--accent-color);
        }
        #savedPlanetsContainer .planet-code {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
            background: #111315;
            padding: 8px;
            border-radius: 4px;
        }
        #savedPlanetsContainer .planet-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        #savedPlanetsContainer .planet-actions button {
            font-size: 12px;
            padding: 5px 10px;
        }
        /* Custom alert/modal styles */
        .custom-alert {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #404853;
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
            font-weight: bold;
        }
        .custom-alert.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
    <!-- Define where to find the 'three' module -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"

    </script>

            <div class="planet-preview">

            </div>

            starTypeA: "一颗炽热明亮的白色恒星",
            starTypeF: "一颗比太阳稍大且更热的黄白色恒星",
            starTypeG: "一颗与我们的太阳非常相似的黄矮星",
            starTypeK: "一颗低温且暗淡的橙红色矮星",
            starTypeM: "一颗低温且非常暗淡的红矮星",
            tidallyLocked: "潮汐锁定",
            notTidallyLocked: "未潮汐锁定",
            copied: "已复制！",
        }
    };

    let currentLang = 'en';
    let lastStarData = {};
    let savedPlanets = [];
    
    // --- 3D Preview Globals ---
    let scene, camera, renderer, controls, systemGroup;

    function setLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('[data-lang-key]').forEach(el => {
            const key = el.dataset.langKey;
            if (translations[lang][key]) {
                el.textContent = translations[lang][key];
            }
        });
        document.querySelectorAll('[data-lang-placeholder-key]').forEach(el => {
            const key = el.dataset.langPlaceholderKey;
            if (translations[lang] && translations[lang][key]) {
                el.placeholder = translations[lang][key];
            }
        });
        if (lastStarData.mass) {
            document.getElementById('starDescription').innerHTML = generateStarDescription(lastStarData);
        }
        renderSavedPlanets();
        document.getElementById('lang-en').classList.toggle('active', lang === 'en');
        document.getElementById('lang-zh').classList.toggle('active', lang === 'zh');
    }

    function t(key) {
        return translations[currentLang][key];
    }

    // --- STAR GENERATOR ---
    function generateStarData() {
        const solar_mass = 1.0;
        const solar_radius = 1.0;
        const solar_temp = 5778;
        const solar_abs_mag = 4.83;

        const spectral_data = {
            "O": [[16, 100], [30000, 50000]], "B": [[2.1, 16], [10000, 30000]],
            "A": [[1.4, 2.1], [7500, 10000]], "F": [[1.04, 1.4], [6000, 7500]],
            "G": [[0.8, 1.04], [5200, 6000]], "K": [[0.45, 0.8], [3700, 5200]],
            "M": [[0.08, 0.45], [2400, 3700]],
        };

        const spectral_type = Object.keys(spectral_data)[Math.floor(Math.random() * Object.keys(spectral_data).length)];
        const [mass_range, temp_range] = spectral_data[spectral_type];
        
        const mass = parseFloat((Math.random() * (mass_range[1] - mass_range[0]) + mass_range[0]).toFixed(3));
        const temperature = Math.floor(Math.random() * (temp_range[1] - temp_range[0]) + temp_range[0]);
        
        const radius_solar_units = Math.pow(mass, 0.75);
        const radius_km = radius_solar_units * solar_radius * 695700;
        const luminosity = Math.pow(radius_solar_units, 2) * Math.pow(temperature / solar_temp, 4);
        const abs_mag = parseFloat((solar_abs_mag - 2.5 * Math.log10(luminosity)).toFixed(3));
        
        const ra = parseFloat((Math.random() * 360).toFixed(6));
        const dec = parseFloat((Math.random() * 90 * (Math.random() > 0.5 ? 1 : -1)).toFixed(6));
        const distance = parseFloat((Math.random() * 9990 + 10).toFixed(4));
        
        const star_name = `DSS-${Math.floor(Math.random() * 9000) + 1000}`;

        lastStarData = { star_name, mass, temperature, radius_km, abs_mag, ra, dec, distance, spectral_type };
        return lastStarData;
    }

    function generateStarDescription(data) {
        const spectral_data_desc = {
            "O": t("starTypeO"), "B": t("starTypeB"), "A": t("starTypeA"), "F": t("starTypeF"),
            "G": t("starTypeG"), "K": t("starTypeK"), "M": t("starTypeM")
        };
        const description_text = spectral_data_desc[data.spectral_type];
        return `<p>${t("starDescName")} "${data.star_name}". ${t("starDescType")} ${description_text}.</p><p><b>${t("starDescProps")}:</b><br>- ${t("starDescMass")}: ${data.mass.toFixed(2)} ${t("starDescMassUnit")}<br>- ${t("starDescTemp")}: ${data.temperature}K<br>- ${t("starDescRadius")}: ${t("starDescApprox")} ${(data.radius_km / 1000).toFixed(2)} ${t("starDescRadiusUnit")}</p><p>${t("starDescLuminosity")} ${data.abs_mag < 4.83 ? t("starDescBrighter") : t("starDescDimmer")} ${t("starDescAbsMag")} ${data.abs_mag}${t("starDescDistance")} ${data.distance} ${t("starDescDistanceUnit")}</p>`;
    }

    function formatStarCode(data) {
        return `"${data.star_name}"\n{\n\tRA ${data.ra.toFixed(6)}\n\tDec ${data.dec.toFixed(6)}\n\tDistance ${data.distance.toFixed(4)}\n\tAbsMag ${data.abs_mag.toFixed(3)}\n\tSpectralType "${data.spectral_type}"\n\tRadius ${Math.round(data.radius_km)}\n\tMass ${data.mass.toFixed(3)}\n\tTemperature ${data.temperature}\n}`;
    }
    
    // Generates a random atmospheric color set based on basic physical principles.
    function generateRandomAtmosphereColors() {
        const baseHue = Math.random() * 360; // Random hue for the atmosphere
        const saturation = 0.5 + Math.random() * 0.5; // Random saturation
        const lightness = 0.5 + Math.random() * 0.5; // Random lightness

        // Function to convert HSL to a normalized RGB array
        function hslToRgb(h, s, l) {
            h = ((h % 360) + 360) % 360;
            h /= 360;
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs((h * 6) % 2 - 1));
            const m = l - c / 2;
            let r, g, b;

            if (0 <= h && h < 1/6) { r = c; g = x; b = 0; }
            else if (1/6 <= h && h < 2/6) { r = x; g = c; b = 0; }
            else if (2/6 <= h && h < 3/6) { r = 0; g = c; b = x; }
            else if (3/6 <= h && h < 4/6) { r = 0; g = x; b = c; }
            else if (4/6 <= h && h < 5/6) { r = x; g = 0; b = c; }
            else if (5/6 <= h && h < 1) { r = c; g = 0; b = x; }
            
            return [r + m, g + m, b + m];
        }

        const skyColor = hslToRgb(baseHue, saturation, lightness).map(c => parseFloat(c.toFixed(3)));
        const lowerColor = skyColor.map(c => Math.max(0, parseFloat((c * 0.7).toFixed(3))));
        const upperColor = skyColor.map(c => Math.max(0, parseFloat((c * 1.0).toFixed(3))));
        
        // Sunset color is typically redder
        const sunsetColor = hslToRgb(baseHue + 30, 0.7, 0.6).map(c => parseFloat(c.toFixed(3)));

        // Rayleigh values are proportional to the sky color
        const rayleigh = skyColor.map(c => parseFloat((c * 0.01).toFixed(4)));

        return {
            sky: skyColor,
            lower: lowerColor,
            upper: upperColor,
            sunset: sunsetColor,
            rayleigh: rayleigh
        };
    }

    // Box-Muller transform for normal distribution
    let nextGaussian = null;
    function generateNormalDistributionValue(mean, stdDev) {
        let u, v, s;
        if (nextGaussian !== null) {
            let result = nextGaussian;
            nextGaussian = null;
            return mean + stdDev * result;
        }

        do {
            u = 2 * Math.random() - 1;
            v = 2 * Math.random() - 1;
            s = u * u + v * v;
        } while (s >= 1 || s === 0);

        let mul = Math.sqrt(-2 * Math.log(s) / s);
        nextGaussian = v * mul;
        return mean + stdDev * u * mul;
    }

    // --- PLANET GENERATOR ---
    function generatePlanetData(star_name, star_mass) {
        const planetType = document.getElementById('planetTypeSelect').value;
        let radius;
        let rotationPeriodMean;
        const ONE_DAY_IN_HOURS = 24;

        if (planetType === 'rocky') {
            radius = Math.floor(Math.random() * (25000 - 2000) + 2000);
            rotationPeriodMean = 96; // 4 Earth days
        } else { // gas
            radius = Math.floor(Math.random() * (120000 - 20000) + 20000);
            rotationPeriodMean = 24; // 1 Earth day
        }
        
        // Generate uniform rotation period using a normal distribution
        const periodHours = Math.max(1, generateNormalDistributionValue(rotationPeriodMean, rotationPeriodMean * 0.2));
        const periodDays = parseFloat((periodHours / ONE_DAY_IN_HOURS).toFixed(2));

        const semiMajorAxisInput = document.getElementById('semiMajorAxisInput');
        const customSemiMajorAxis = parseFloat(semiMajorAxisInput.value);
        const semi_major_axis = !isNaN(customSemiMajorAxis) && customSemiMajorAxis > 0.0 ? customSemiMajorAxis : parseFloat((Math.random() * (15.0 - 0.1) + 0.1).toFixed(4));
        const orbital_period = parseFloat(Math.sqrt(Math.pow(semi_major_axis, 3) / star_mass).toFixed(4));
        const eccentricity = parseFloat((Math.random()**2 * 0.4 + 0.001).toFixed(4));
        const planetName = document.getElementById('planetName').value || "B";
        
        const atmosphericColors = generateRandomAtmosphereColors();

        const atmosphereHeight = Math.round(radius * 0.02 * ((Math.random() * 0.2) + 0.9));
        const mieScaleHeight = Math.round(atmosphereHeight * 0.1 * ((Math.random() * 0.2) + 0.9));
        const mieValue = parseFloat((Math.random()**3 * 0.04/atmosphereHeight).toFixed(4)) + 0.04/atmosphereHeight;
        const mieAsymmetryValue = parseFloat((Math.random() * 0.5).toFixed(2));

        // Check for tidal lock (heuristic based on orbital period)
        const TIDAL_LOCK_THRESHOLD_PERIOD = 2; // in Earth days
        const isTidallyLocked = (orbital_period * 365.25) <= TIDAL_LOCK_THRESHOLD_PERIOD;

        const planetDataObject = {
            planet_name: planetName,
            star_name,
            radius,
            orbital_period,
            semi_major_axis,
            eccentricity,
            inclination_orbit: parseFloat((Math.random()**3 * 180).toFixed(4)),
            ascending_node_orbit: parseFloat((Math.random() * 360).toFixed(4)),
            arg_of_pericenter: parseFloat((Math.random() * 360).toFixed(4)),
            mean_anomaly: parseFloat((Math.random() * 360).toFixed(4)),
            texture: `${planetName}.*`,
            bumpMap: `${planetName}-bump.*`,
            bumpHeight: 1.5,
            atmosphere: {
                height: atmosphereHeight,
                lower: atmosphericColors.lower,
                upper: atmosphericColors.upper,
                sky: atmosphericColors.sky,
                sunset: atmosphericColors.sunset,
                mieScaleHeight: mieScaleHeight,
                mie: mieValue,
                mieAsymmetry: mieAsymmetryValue,
                rayleigh: atmosphericColors.rayleigh
            },
            uniformRotation: {
                period: periodDays * 24,
                inclination: parseFloat((Math.random() * 180).toFixed(1)),
                ascendingNode: parseFloat((Math.random() * 360).toFixed(1))
            },
            isTidallyLocked: isTidallyLocked,
        };
        return planetDataObject;
    }

    function formatPlanetCode(data) {
        return `"${data.planet_name}" "${data.star_name}"\n{\n\tTexture "${data.texture}"\n\tBumpMap "${data.bumpMap}"\n\tBumpHeight ${data.bumpHeight}\n\tRadius ${data.radius}\n\tEllipticalOrbit\n\t{\n\t\tPeriod ${data.orbital_period.toFixed(4)}\n\t\tSemiMajorAxis ${data.semi_major_axis.toFixed(4)}\n\t\tEccentricity ${data.eccentricity.toFixed(4)}\n\t\tInclination ${data.inclination_orbit.toFixed(4)}\n\t\tAscendingNode ${data.ascending_node_orbit.toFixed(4)}\n\t\tArgOfPericenter ${data.arg_of_pericenter.toFixed(4)}\n\t\tMeanAnomaly ${data.mean_anomaly.toFixed(4)}\n\t}\n\tAtmosphere\n\t{\n\t\tHeight ${data.atmosphere.height}\n\t\tLower [ ${data.atmosphere.lower.join(' ')} ]\n\t\tUpper [ ${data.atmosphere.upper.join(' ')} ]\n\t\tSky [ ${data.atmosphere.sky.join(' ')} ]\n\t\tSunset [ ${data.atmosphere.sunset.join(' ')} ]\n\t\tMieScaleHeight ${data.atmosphere.mieScaleHeight}\n\t\tMie ${data.atmosphere.mie}\n\t\tMieAsymmetry ${data.atmosphere.mieAsymmetry}\n\t\tRayleigh [ ${data.atmosphere.rayleigh.join(' ')} ]\n\t}\n\tUniformRotation\n\t{\n\t\tPeriod ${data.uniformRotation.period}\n\t\tInclination ${data.uniformRotation.inclination}\n\t\tAscendingNode ${data.uniformRotation.ascendingNode}\n\t}\n}`;
    }
    
    // --- UI RENDERING ---
    function renderSavedPlanets() {
        const container = document.getElementById('planetsList');
        container.innerHTML = '';
        savedPlanets.forEach((planet, index) => {
            const tidalLockStatus = planet.isTidallyLocked ? `<span style="color: var(--orange-color); font-weight: bold;">${t('tidallyLocked')}</span>` : `<span style="color: var(--green-color); font-weight: bold;">${t('notTidallyLocked')}</span>`;
            const entry = document.createElement('div');
            entry.className = 'planet-entry';
            entry.innerHTML = `<h3>${planet.star_name} ${planet.planet_name}</h3><p>${tidalLockStatus}</p><div class="planet-code">${formatPlanetCode(planet)}</div><div class="planet-actions"><button class="btn-secondary copy-planet" data-index="${index}">${t('copyBtn')}</button><button class="btn-danger remove-planet" data-index="${index}">${t('removeBtn')}</button></div>`;
            container.appendChild(entry);
        });
    }

    function getStarColor(type) {
        const colors = { "O": "#9bb0ff", "B": "#aabfff", "A": "#cad7ff", "F": "#f8f7ff", "G": "#fff4ea", "K": "#ffd2a1", "M": "#ffcc6f" };
        return colors[type] || "#ffffff";
    }
    
    // --- 3D ORBIT PREVIEW ---
    function init3DPreview() {
        const canvas = document.getElementById('orbitCanvas');
        scene = new THREE.Scene();
        
        camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        camera.position.set(10, 10, 10);
        
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        systemGroup = new THREE.Group();
        scene.add(systemGroup);

        window.addEventListener('resize', onWindowResize, false);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    }
    
    function onWindowResize() {
        const canvas = document.getElementById('orbitCanvas');
        if (!canvas) return;
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
    }

    function update3DPreview(planets, starData) {
        // Clear previous system
        while(systemGroup.children.length > 0){ 
            systemGroup.remove(systemGroup.children[0]); 
        }

        if (!starData.mass) return;
        
        let maxApoapsis = 0;
        planets.forEach(p => {
            const apoapsis = p.semi_major_axis * (1 + p.eccentricity);
            if (apoapsis > maxApoapsis) maxApoapsis = apoapsis;
        });
        const scale = maxApoapsis > 0 ? 20 / maxApoapsis : 20;

        // Draw Star
        const starRadius = Math.max(0.5, Math.pow(starData.mass, 0.5) * 0.5) * (scale / 20); // Scale star size reasonably
        const starGeometry = new THREE.SphereGeometry(starRadius, 32, 32);
        const starColor = getStarColor(starData.spectral_type);
        const starMaterial = new THREE.MeshBasicMaterial({ color: starColor });
        const star = new THREE.Mesh(starGeometry, starMaterial);
        systemGroup.add(star);
        
        const starLight = new THREE.PointLight(starColor, 1.5, 1000);
        systemGroup.add(starLight);

        // Reference plane (ecliptic)
        const gridHelper = new THREE.GridHelper(maxApoapsis * scale * 2.2, 20);
        gridHelper.rotation.x = Math.PI / 2;
        systemGroup.add(gridHelper);

        // Draw Orbits and Planets
        const orbitColors = [0x00aaff, 0xff6347, 0x32cd32, 0xffd700, 0xba55d3, 0xff4500];

        planets.forEach((planet, index) => {
            const a = planet.semi_major_axis * scale;
            const e = planet.eccentricity;
            const c = e * a; // distance from center to focus
            const b = Math.sqrt(a*a - c*c); // semi-minor axis

            const curve = new THREE.EllipseCurve( -c, 0, a, b, 0, 2 * Math.PI, false, 0 );
            const points = curve.getPoints(128);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: orbitColors[index % orbitColors.length] });
            const ellipse = new THREE.Line(geometry, material);
            
            const orbitGroup = new THREE.Group();
            orbitGroup.add(ellipse);

            // Correctly apply orbital elements using matrix transformations.
            const i = THREE.MathUtils.degToRad(planet.inclination_orbit);
            const w = THREE.MathUtils.degToRad(planet.arg_of_pericenter);
            const o = THREE.MathUtils.degToRad(planet.ascending_node_orbit);
            
            // Create rotation matrices for each element
            const rot_w = new THREE.Matrix4().makeRotationZ(w); // 1. Argument of Pericenter
            const rot_i = new THREE.Matrix4().makeRotationX(i); // 2. Inclination
            const rot_o = new THREE.Matrix4().makeRotationZ(o); // 3. Longitude of Ascending Node

            // Combine the matrices. Matrix multiplication order is read right-to-left.
            const rotationMatrix = new THREE.Matrix4();
            rotationMatrix.multiply(rot_o);
            rotationMatrix.multiply(rot_i);
            rotationMatrix.multiply(rot_w);

            // Apply the final rotation matrix to the orbit group
            orbitGroup.setRotationFromMatrix(rotationMatrix);

            systemGroup.add(orbitGroup);

            // Position planet on its orbit
            // This is a simplified positioning using mean anomaly directly
            // A full implementation requires solving Kepler's equation
            const meanAnomalyRad = THREE.MathUtils.degToRad(planet.mean_anomaly);
            const planetPos = curve.getPoint(meanAnomalyRad / (2 * Math.PI));

            const planetRadius = Math.max(0.2, (planet.radius / 6371) * 0.2) * (scale / 20); // Earth radius = 6371km
            const planetGeom = new THREE.SphereGeometry(planetRadius, 16, 16);
            const planetMat = new THREE.MeshStandardMaterial({ 
                color: orbitColors[index % orbitColors.length], 
                roughness: 0.8 
            });
            const planetMesh = new THREE.Mesh(planetGeom, planetMat);
            planetMesh.position.set(planetPos.x, planetPos.y, 0);

            // Add the planet mesh to the rotated orbit group
            orbitGroup.add(planetMesh);
        });
        
        // Update camera position to fit the system
        camera.position.set(maxApoapsis * scale * 0.8, maxApoapsis * scale * 0.8, maxApoapsis * scale * 0.8);
        controls.target.set(0, 0, 0);
        controls.update();
    }


    // --- EVENT LISTENERS ---
    document.addEventListener('DOMContentLoaded', () => {
        const starOutput = document.getElementById('starOutput');
        const starDesc = document.getElementById('starDescription');

        init3DPreview(); // Initialize the 3D scene

        document.getElementById('generateStarBtn').addEventListener('click', () => {
            const data = generateStarData();
            starOutput.textContent = formatStarCode(data);
            starDesc.innerHTML = generateStarDescription(data);
            
            savedPlanets = [];
            renderSavedPlanets();
            update3DPreview(savedPlanets, lastStarData);
            document.getElementById('planetName').value = "B";
            document.getElementById('semiMajorAxisInput').value = "";
        });

        document.getElementById('copyStarBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(starOutput.textContent.trim()).then(() => showAlert(t('copied')));
        });

        document.getElementById('generatePlanetBtn').addEventListener('click', () => {
            if (!lastStarData.mass) {
                showAlert(currentLang === 'zh' ? '请先生成一颗恒星！' : 'Please generate a star first!');
                return;
            }
            const data = generatePlanetData(lastStarData.star_name, lastStarData.mass);
            savedPlanets.push(data);
            renderSavedPlanets();
            update3DPreview(savedPlanets, lastStarData);
            
            const currentName = document.getElementById('planetName').value;
            document.getElementById('planetName').value = String.fromCharCode(currentName.charCodeAt(0) + 1);
        });
        
        document.getElementById('clearPlanetsBtn').addEventListener('click', () => {
            savedPlanets = [];
            renderSavedPlanets();
            update3DPreview(savedPlanets, lastStarData);
            document.getElementById('planetName').value = "B";
            document.getElementById('semiMajorAxisInput').value = "";
        });

        document.getElementById('planetsList').addEventListener('click', (e) => {
            const target = e.target;
            const index = target.dataset.index;
            if (index === undefined) return;

            if (target.classList.contains('copy-planet')) {
                const planetCode = formatPlanetCode(savedPlanets[index]);
                navigator.clipboard.writeText(planetCode.trim()).then(() => showAlert(t('copied')));
            } else if (target.classList.contains('remove-planet')) {
                savedPlanets.splice(index, 1);
                renderSavedPlanets();
                update3DPreview(savedPlanets, lastStarData);
            }
        });

        document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));
        document.getElementById('lang-zh').addEventListener('click', () => setLanguage('zh'));

        setLanguage('en');
        document.getElementById('generateStarBtn').click();
        onWindowResize(); // Ensure initial size is correct
    });
</script>
