<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestia CMS 模型生成器</title>
    <style>
        :root {
            --bg-color: #1a1e23;
            --panel-bg: #2a2f36;
            --text-color: #e0e6ec;
            --header-color: #ffffff;
            --border-color: #404853;
            --accent-color: #00aaff;
            --accent-hover: #0088cc;
            --input-bg: #111315;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .controls {
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            width: 380px;
            padding: 25px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .preview-container {
            flex-grow: 1;
            position: relative;
        }
        #preview-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        h1, h2 {
            color: var(--header-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 0;
            font-weight: 600;
        }
        .control-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .vector-inputs {
            display: flex;
            gap: 10px;
        }
        .vector-inputs input {
            width: 100%;
        }
        input[type="range"], input[type="number"] {
            width: 100%;
            padding: 8px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
        }
        input[type="range"] {
            padding: 0;
        }
        .value-display {
            display: inline-block;
            margin-left: 10px;
            font-family: monospace;
            color: var(--accent-color);
        }
        .code-output {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        #cms-code {
            flex-grow: 1;
            width: 100%;
            background-color: #111315;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: 'SF Mono', 'Courier New', Courier, monospace;
            font-size: 14px;
            box-sizing: border-box;
            resize: none;
        }
        button {
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            background-color: var(--accent-color);
            color: white;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <h1>CMS 模型参数</h1>
        
        <div class="control-group">
            <label for="sizeX">尺寸 (Size)</label>
            <div class="vector-inputs">
                <input type="range" id="sizeX" min="0.1" max="2" step="0.01" value="1">
                <input type="range" id="sizeY" min="0.1" max="2" step="0.01" value="1">
                <input type="range" id="sizeZ" min="0.1" max="2" step="0.01" value="1">
            </div>
            <span class="value-display" id="size-display">1.00 1.00 1.00</span>
        </div>

        <div class="control-group">
            <label for="noiseX">噪波偏移 (NoiseOffset)</label>
            <div class="vector-inputs">
                <input type="range" id="noiseX" min="-10" max="10" step="0.1" value="0">
                <input type="range" id="noiseY" min="-10" max="10" step="0.1" value="0">
                <input type="range" id="noiseZ" min="-10" max="10" step="0.1" value="0">
            </div>
            <span class="value-display" id="noise-display">0 0 0</span>
        </div>

        <div class="control-group">
            <label for="featureHeight">表面高度 (FeatureHeight)</label>
            <input type="range" id="featureHeight" min="0" max="1.0" step="0.01" value="0.2">
            <span class="value-display" id="height-display">0.20</span>
        </div>
        
        <div class="control-group">
            <label for="octaves">扭曲程度 (Octaves)</label>
            <input type="range" id="octaves" min="1" max="10" step="1" value="7">
            <span class="value-display" id="octaves-display">7</span>
        </div>
        
        <div class="code-output">
            <h2>CMS 文件输出</h2>
            <textarea id="cms-code" readonly></textarea>
            <button id="copy-btn">复制到剪贴板</button>
        </div>
    </div>
    <div class="preview-container">
        <canvas id="preview-canvas"></canvas>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- DOM Elements ---
    const controls = {
        size: { x: document.getElementById('sizeX'), y: document.getElementById('sizeY'), z: document.getElementById('sizeZ') },
        noise: { x: document.getElementById('noiseX'), y: document.getElementById('noiseY'), z: document.getElementById('noiseZ') },
        featureHeight: document.getElementById('featureHeight'),
        octaves: document.getElementById('octaves'),
    };
    const displays = {
        size: document.getElementById('size-display'),
        noise: document.getElementById('noise-display'),
        height: document.getElementById('height-display'),
        octaves: document.getElementById('octaves-display'),
    };
    const codeOutput = document.getElementById('cms-code');
    const copyBtn = document.getElementById('copy-btn');
    const canvas = document.getElementById('preview-canvas');

    // --- 3D Scene Setup ---
    let scene, camera, renderer, mesh, simplex;

    function init() {
        scene = new THREE.Scene();
        
        camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        camera.position.z = 2.5;

        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);

        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(1, 1, 1);
        scene.add(directionalLight);

        simplex = new SimplexNoise();
        
        const geometry = new THREE.SphereGeometry(1, 128, 128);
        geometry.userData.originalVertices = [];
        const vertices = geometry.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
             geometry.userData.originalVertices.push(new THREE.Vector3(vertices[i], vertices[i+1], vertices[i+2]));
        }

        const material = new THREE.MeshStandardMaterial({ color: 0xcccccc, wireframe: false });
        mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        window.addEventListener('resize', onWindowResize, false);
        
        setupControls();
        updateAll();
        animate();
    }

    // --- Update Logic ---
    function updateDisplacement() {
        if (!mesh) return;

        const params = getParams();
        const geometry = mesh.geometry;
        const vertices = geometry.attributes.position.array;
        
        for (let i = 0; i < geometry.userData.originalVertices.length; i++) {
            const v = geometry.userData.originalVertices[i].clone();
            let displacement = 0;
            let frequency = 1.0;
            let amplitude = 1.0;
            let maxAmplitude = 0; // 用于归一化位移
            
            for (let j = 0; j < params.octaves; j++) {
                let p = v.clone().multiplyScalar(frequency);
                displacement += simplex.noise3D(
                    p.x + params.noise.x,
                    p.y + params.noise.y,
                    p.z + params.noise.z
                ) * amplitude;
                
                maxAmplitude += amplitude; // 累加最大振幅

                frequency *= 2.0;
                amplitude *= 0.5;
            }

            // 将位移归一化到 [-1, 1] 的范围
            if (maxAmplitude > 0) {
                displacement /= maxAmplitude;
            }

            const finalDisplacement = v.clone().normalize().multiplyScalar(displacement * params.featureHeight);
            const newPos = v.clone().add(finalDisplacement);
            
            vertices[i * 3] = newPos.x;
            vertices[i * 3 + 1] = newPos.y;
            vertices[i * 3 + 2] = newPos.z;
        }

        geometry.attributes.position.needsUpdate = true;
        geometry.computeVertexNormals();
        
        mesh.scale.set(params.size.x, params.size.y, params.size.z);
    }
    
    function updateCodeOutput() {
        const params = getParams();
        const formatVector = v => `[ ${v.x.toFixed(3)} ${v.y.toFixed(3)} ${v.z.toFixed(3)} ]`;

        const code = `SphereDisplacementMesh
{
    Size            ${formatVector(params.size)}
    NoiseOffset     [ ${params.noise.x.toFixed(0)} ${params.noise.y.toFixed(0)} ${params.noise.z.toFixed(0)} ]
    FeatureHeight   ${params.featureHeight.toFixed(3)}
    Octaves         ${params.octaves}
}`;
        codeOutput.value = code;
    }

    function updateDisplays() {
        const params = getParams();
        displays.size.textContent = `${params.size.x.toFixed(2)} ${params.size.y.toFixed(2)} ${params.size.z.toFixed(2)}`;
        displays.noise.textContent = `${params.noise.x.toFixed(0)} ${params.noise.y.toFixed(0)} ${params.noise.z.toFixed(0)}`;
        displays.height.textContent = params.featureHeight.toFixed(2);
        displays.octaves.textContent = params.octaves;
    }

    function updateAll() {
        updateDisplacement();
        updateCodeOutput();
        updateDisplays();
    }
    
    // --- Helpers & Event Handlers ---
    function getParams() {
        return {
            size: {
                x: parseFloat(controls.size.x.value),
                y: parseFloat(controls.size.y.value),
                z: parseFloat(controls.size.z.value),
            },
            noise: {
                x: parseFloat(controls.noise.x.value) * 10,
                y: parseFloat(controls.noise.y.value) * 10,
                z: parseFloat(controls.noise.z.value) * 10,
            },
            featureHeight: parseFloat(controls.featureHeight.value),
            octaves: parseInt(controls.octaves.value),
        };
    }
    
    function setupControls() {
        // Correctly iterate and add event listeners to all controls
        Object.values(controls).forEach(el => {
            // Check if it's a plain object for vector controls (like size, noise)
            if (el.tagName === undefined) {
                Object.values(el).forEach(subEl => subEl.addEventListener('input', updateAll));
            } else { // It's a direct DOM element (like featureHeight, octaves)
                el.addEventListener('input', updateAll);
            }
        });

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        canvas.addEventListener('mousedown', e => { isDragging = true; });
        canvas.addEventListener('mouseup', e => { isDragging = false; });
        canvas.addEventListener('mouseleave', e => { isDragging = false; });
        canvas.addEventListener('mousemove', e => {
            if (!isDragging) return;
            const deltaMove = {
                x: e.offsetX - previousMousePosition.x,
                y: e.offsetY - previousMousePosition.y
            };
            mesh.rotation.y += deltaMove.x * 0.005;
            mesh.rotation.x += deltaMove.y * 0.005;
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });
        canvas.addEventListener('wheel', e => {
            camera.position.z += e.deltaY * 0.002;
            camera.position.z = Math.max(1.5, Math.min(10, camera.position.z));
        });
        
        copyBtn.addEventListener('click', () => {
            codeOutput.select();
            document.execCommand('copy');
        });
    }

    function onWindowResize() {
        const previewContainer = canvas.parentElement;
        camera.aspect = previewContainer.clientWidth / previewContainer.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(previewContainer.clientWidth, previewContainer.clientHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    init();
});
</script>
</body>
</html>
