<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>气体巨行星贴图生成器 | Gas Giant Texture Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Simplex Noise 库 -->
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 OrbitControls -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body class="text-gray-200 flex flex-col items-center min-h-screen p-4">

    <div class="w-full max-w-6xl bg-gray-800/80 rounded-2xl shadow-2xl backdrop-blur-md border border-gray-700 overflow-hidden">
        
        <!-- Header -->
        <div class="p-6 sm:p-8 border-b border-gray-700 bg-gray-900/50">

                    <p class="text-gray-400 text-sm mt-1">程序化生成无缝贴图与 3D 大气渲染预览</p>

        <div class="grid grid-cols-1 lg:grid-cols-12 h-auto lg:h-[800px]">
            
            <!-- 左侧：控制面板与 2D 预览 -->

                <!-- Controls -->

            </div>

            <!-- 右侧：3D 预览 -->

                <!-- 3D Overlay UI -->

                        🖱️ 左键旋转 | 右键平移 | 滚轮缩放
                    </div>
                </div>
                
                <div class="absolute bottom-4 left-4 pointer-events-none">
                    <h2 class="text-white/80 font-bold text-lg">3D 实时预览</h2>
                    <p class="text-white/40 text-xs">Simulated Atmosphere & Rayleigh Scattering</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Global Variables for 3D ---
        let scene, camera, renderer, planetMesh, atmosphereMesh, controls;
        let planetMaterial, atmosphereMaterial;

        // --- DOM Elements ---
        const resolutionSelect = document.getElementById('resolution');
        const paletteSelect = document.getElementById('palette');
        const greatStormCheckbox = document.getElementById('greatStorm');
        const filterColorInput = document.getElementById('filterColor');
        const atmosphereColorInput = document.getElementById('atmosphereColor');
        const canvas = document.getElementById('planetCanvas');
        const ctx = canvas.getContext('2d');
        const generateBtn = document.getElementById('generateBtn');
        const downloadLink = document.getElementById('downloadLink');
        const statusText = document.getElementById('statusText');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');

        // --- Palettes ---
        const PALETTES = {
            "astral_haze": [[101, 98, 116], [109, 116, 137], [210, 174, 192], [182, 210, 173], [50, 80, 140], [10, 30, 70]],
            "icy_neptune": [[50, 80, 150], [80, 120, 200], [30, 50, 100], [180, 200, 240], [72, 93, 108], [167, 237, 255]],
            "golden_saturn": [[181, 158, 123], [180, 160, 130], [140, 120, 100], [250, 240, 220], [86, 78, 68], [155, 149, 127]],
            "sunset_dream": [[255, 94, 77], [255, 142, 101], [255, 184, 128], [255, 215, 160], [180, 110, 90], [120, 60, 50]],
            "frosted_mint": [[200, 255, 230], [160, 240, 210], [120, 220, 190], [80, 200, 160], [40, 180, 130], [0, 150, 100]],
            "cosmic_violet": [[90, 50, 120], [120, 70, 150], [160, 100, 180], [200, 140, 210], [230, 190, 240], [50, 20, 80]],
            "desert_ember": [[210, 120, 80], [230, 150, 100], [245, 180, 120], [250, 210, 150], [180, 100, 70], [120, 60, 40]],
            "oceanic_tide": [[20, 60, 120], [30, 90, 160], [50, 120, 200], [80, 160, 220], [100, 180, 240], [10, 40, 100]],
            "forest_moss": [[50, 80, 40], [70, 110, 60], [100, 140, 90], [130, 170, 120], [160, 200, 150], [30, 60, 20]],
            "hot_jupiter": [[80, 40, 20], [180, 100, 40], [40, 30, 25], [255, 180, 80], [210, 170, 130], [255, 245, 220]],
            "misty_green": [[25, 55, 60], [20, 100, 105], [25, 85, 90], [30, 125, 155], [30, 130, 140], [70, 125, 135]]
        };

        // --- Utility Functions ---
        const random = () => Math.random();
        const randint = (min, max) => Math.floor(random() * (max - min + 1)) + min;
        const uniform = (min, max) => random() * (max - min) + min;
        const choice = (arr) => arr[Math.floor(random() * arr.length)];
        const biased_randint = (low, high, bias = 2.0) => low + Math.floor(Math.pow(random(), bias) * (high - low + 1));
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        const hexToRgb = (hex) => {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? [parseInt(result[1], 16), parseInt(result[2], 16), parseInt(result[3], 16)] : [255, 255, 255];
        }

        // --- 3D Scene Initialization ---
        function init3D() {
            const container = document.getElementById('scene-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // Scene
            scene = new THREE.Scene();
            // Starfield background
            const starGeo = new THREE.BufferGeometry();
            const starCount = 2000;
            const posArray = new Float32Array(starCount * 3);
            for(let i=0; i<starCount*3; i++) {
                posArray[i] = (Math.random() - 0.5) * 50; // spread
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starMat = new THREE.PointsMaterial({size: 0.02, color: 0xffffff, transparent: true, opacity: 0.8});
            const stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);


            // Camera
            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
            camera.position.z = 3.5;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5); // Soft white light
            scene.add(ambientLight);
            
            const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
            sunLight.position.set(5, 3, 5);
            scene.add(sunLight);

            // --- PLANET MESH ---
            const geometry = new THREE.SphereGeometry(1, 64, 64);
            planetMaterial = new THREE.MeshStandardMaterial({
                map: null, // Will be set later
                roughness: 0.8,
                metalness: 0.1
            });
            planetMesh = new THREE.Mesh(geometry, planetMaterial);
            scene.add(planetMesh);

            // --- ATMOSPHERE MESH (Shader) ---
            // Rayleigh scattering approximation using Fresnel shader
            const atmosphereGeometry = new THREE.SphereGeometry(1.04, 64, 64); // Slightly larger
            
            const vertexShader = `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;

            const fragmentShader = `
                varying vec3 vNormal;
                uniform vec3 glowColor;
                uniform float bias;
                uniform float power;
                uniform float scale;

                void main() {
                    float intensity = pow(bias - dot(vNormal, vec3(0, 0, 1.0)), power);
                    gl_FragColor = vec4(glowColor, 1.0) * intensity * scale;
                }
            `;

            atmosphereMaterial = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: {
                    glowColor: { value: new THREE.Color(0x4ca1ff) },
                    bias: { value: 0.6 }, // 调整光晕起始位置
                    power: { value: 4.5 }, // 调整光晕衰减
                    scale: { value: 1.0 }
                },
                side: THREE.BackSide, // 渲染背面，模拟大气包裹
                blending: THREE.AdditiveBlending,
                transparent: true
            });

            atmosphereMesh = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
            scene.add(atmosphereMesh);

            // Resize handler
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function onWindowResize() {
            const container = document.getElementById('scene-container');
            if(!container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function update3DTexture() {
            if (!planetMesh) return;
            
            // Create texture from the generated canvas
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter; // Smooth look
            
            // Dispose old texture to free memory
            if (planetMaterial.map) planetMaterial.map.dispose();

            planetMaterial.map = texture;
            planetMaterial.needsUpdate = true;

            // Update Atmosphere Color
            const atmHex = atmosphereColorInput.value;
            atmosphereMaterial.uniforms.glowColor.value = new THREE.Color(atmHex);
        }

        // --- Noise Functions (Keep Existing) ---
        let simplex;
        const seamless_horizontal_noise = (x, y, scale, stretch_factor = 4.0) => {
            const angle = 2 * Math.PI * x;
            const nx = Math.cos(angle) * scale / stretch_factor;
            const ny = Math.sin(angle) * scale / stretch_factor;
            const nz = y * scale;
            return simplex.noise3D(nx, ny, nz);
        };

        // --- Graphics & Math Helper Functions (Keep Existing) ---
        class PixelArray {
            constructor(width, height, data = null) {
                this.width = width;
                this.height = height;
                this.data = data || new Float32Array(width * height * 4);
            }
            static fromImageData(imageData) {
                const floatData = new Float32Array(imageData.data);
                return new PixelArray(imageData.width, imageData.height, floatData);
            }
            toImageData() {
                const clampedData = new Uint8ClampedArray(this.data);
                return new ImageData(clampedData, this.width, this.height);
            }
            get(y, x) {
                const safeY = Math.max(0, Math.min(this.height - 1, Math.floor(y)));
                let safeX = Math.floor(x);
                safeX = (safeX % this.width + this.width) % this.width;
                const i = (safeY * this.width + safeX) * 4;
                if (isNaN(i)) { return [0, 0, 0, 255]; }
                return [this.data[i], this.data[i+1], this.data[i+2], this.data[i+3]];
            }
            set(y, x, color) {
                const i = (y * this.width + x) * 4;
                this.data[i] = color[0];
                this.data[i+1] = color[1];
                this.data[i+2] = color[2];
                if (color.length > 3) this.data[i+3] = color[3];
            }
            clone() {
                return new PixelArray(this.width, this.height, new Float32Array(this.data));
            }
        }

        const mapCoordinates = (inputArray, coordinates) => {
            const outputArray = new PixelArray(inputArray.width, inputArray.height);
            const { width, height } = inputArray;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const newY = coordinates[0][y][x];
                    const newX = coordinates[1][y][x];
                    const x1 = Math.floor(newX);
                    const y1 = Math.floor(newY);
                    const dx = newX - x1;
                    const dy = newY - y1;
                    let finalColor = [0, 0, 0, 255];
                    for (let c = 0; c < 3; c++) {
                        const p1 = inputArray.get(y1, x1)[c];
                        const p2 = inputArray.get(y1, x1 + 1)[c];
                        const p3 = inputArray.get(y1 + 1, x1)[c];
                        const p4 = inputArray.get(y1 + 1, x1 + 1)[c];
                        const val = p1 * (1 - dx) * (1 - dy) + p2 * dx * (1 - dy) + p3 * (1 - dx) * dy + p4 * dx * dy;
                        finalColor[c] = val;
                    }
                    outputArray.set(y, x, finalColor);
                }
            }
            return outputArray;
        };
        
        const swirl = (inputArray, centerY, centerX, strength, radius) => {
             const outputArray = inputArray.clone();
             const { width, height } = inputArray;
             for (let y = 0; y < height; y++) {
                 for (let x = 0; x < width; x++) {
                     const dx = x - centerX;
                     const dy = y - centerY;
                     const dist = Math.sqrt(dx * dx + dy * dy);
                     if (dist < radius) {
                         const factor = 1 - (dist / radius);
                         const angle = (strength * factor * factor) * Math.PI / 180;
                         const cosA = Math.cos(angle);
                         const sinA = Math.sin(angle);
                         const srcX = dx * cosA - dy * sinA + centerX;
                         const srcY = dx * sinA + dy * cosA + centerY;
                         outputArray.set(y, x, inputArray.get(srcY, srcX));
                     }
                 }
             }
             return outputArray;
        };

        // --- Core Generation Logic ---

        async function updateStatus(message) {
            statusText.textContent = message;
            await sleep(10); // slightly faster updates
        }

        async function addMainBands(planetArray, palette) {
            const { width, height } = planetArray;
            const num_bands = biased_randint(12, 20, 1.8);
            const band_colors = palette.slice(1);

            for (let i = 0; i < num_bands; i++) {
                // Simplified logging to avoid spam
                if(i % 5 === 0) await updateStatus(`绘制云带... (${Math.round(i/num_bands*100)}%)`);
                
                const y_center = randint(0, height);
                const band_height = uniform(height * 0.03, height * 0.2);
                const band_color = choice(band_colors);
                
                const wave_amplitude = uniform(height * 0.002, height * 0.008);
                const wave_scale = uniform(1.0, 6.0);

                const bandLayer = new PixelArray(width, height);

                for (let x = 0; x < width; x++) {
                    const base_wave = seamless_horizontal_noise(x / width, i / num_bands, wave_scale);
                    const micro_wave = seamless_horizontal_noise(x / width, (i+10) / num_bands, wave_scale * 4.0) * 0.3;
                    
                    const y_offset = (base_wave + micro_wave) * wave_amplitude;
                    const waved_y_center = y_center + y_offset;

                    const turbulence_noise = (seamless_horizontal_noise(x / width, waved_y_center / height * 5, 30, 20.0) + 1) / 2;

                    for (let y = 0; y < height; y++) {
                        const intensity = 0.4 * Math.exp(-Math.pow(y - waved_y_center, 2) / (2 * Math.pow(band_height / 4, 2)));
                        const final_intensity = intensity * (0.85 + 0.15 * turbulence_noise);

                        const r = band_color[0] * final_intensity;
                        const g = band_color[1] * final_intensity;
                        const b = band_color[2] * final_intensity;
                        bandLayer.set(y, x, [r, g, b, 255]);
                    }
                }
                
                for(let i=0; i < planetArray.data.length; i += 4) {
                    const band_r = bandLayer.data[i];
                    const alpha = Math.min(1, Math.max(band_r, bandLayer.data[i+1], bandLayer.data[i+2]) / 255.0);
                    planetArray.data[i] = planetArray.data[i] * (1-alpha) + band_r;
                    planetArray.data[i+1] = planetArray.data[i+1] * (1-alpha) + bandLayer.data[i+1];
                    planetArray.data[i+2] = planetArray.data[i+2] * (1-alpha) + bandLayer.data[i+2];
                }
            }
            return planetArray;
        }

        async function addAtmosphericDetail(planetArray) {
            const { width, height } = planetArray;
            await updateStatus("添加大气噪点...");

            const noiseScale = 150.0;
            const noiseStrength = 0.04;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const noiseVal = (seamless_horizontal_noise(x / width, y / height, noiseScale) + 1) / 2;
                    const factor = 1.0 + (noiseVal - 0.5) * noiseStrength;

                    const i = (y * width + x) * 4;
                    planetArray.data[i] *= factor;
                    planetArray.data[i+1] *= factor;
                    planetArray.data[i+2] *= factor;
                }
            }
            return planetArray;
        }

        async function addGlowingJetStreams(planetArray) {
            const { width, height } = planetArray;
            const num_jets = randint(0, 8);
            
            for (let i = 0; i < num_jets; i++) {
                if(i%2===0) await updateStatus("生成激流...");
                const jetLayer = new PixelArray(width, height);
                const y_center = randint(0, height);
                const jet_height = uniform(height * 0.005, height * 0.015);
                const glow_color = [240, 240, 255];
                
                const main_wave_amp = uniform(height * 0.01, height * 0.03);
                const main_wave_scale = uniform(2.0, 8.0);
                const turb_wave_amp = uniform(height * 0.005, height * 0.01);
                const turb_wave_scale = uniform(1.0, 4.0);

                for (let x = 0; x < width; x++) {
                    const x_norm = x / width;
                    const main_offset = seamless_horizontal_noise(x_norm, i / num_jets, main_wave_scale) * main_wave_amp;
                    const turb_offset = seamless_horizontal_noise(x_norm, i / num_jets, turb_wave_scale, 2.0) * turb_wave_amp;
                    const waved_y_center = y_center + main_offset + turb_offset;
                    
                    const mask = (simplex.noise2D(x_norm * (width / 60.0), i * 5) + 1) / 2;
                    let alpha = Math.pow(mask, 1.5);
                    if (random() < 0.002) alpha *= uniform(0.0, 0.3);

                    for (let y = 0; y < height; y++) {
                        const intensity = Math.exp(-Math.pow(y - waved_y_center, 2) / (2 * Math.pow(jet_height / 2, 2)));
                        const r = glow_color[0] * intensity * alpha;
                        const g = glow_color[1] * intensity * alpha;
                        const b = glow_color[2] * intensity * alpha;
                        jetLayer.set(y, x, [r, g, b, 255]);
                    }
                }
                
                const blend_strength = uniform(0.1, 0.3);
                for(let i=0; i < planetArray.data.length; i += 4) {
                    planetArray.data[i] += jetLayer.data[i] * blend_strength;
                    planetArray.data[i+1] += jetLayer.data[i+1] * blend_strength;
                    planetArray.data[i+2] += jetLayer.data[i+2] * blend_strength;
                }
            }
            return planetArray;
        }

        async function applyFlowDistortion(planetArray) {
            const { width, height } = planetArray;
            const scaleFactor = width / 1024.0;
            const shearStrength = uniform(0, 60) * scaleFactor;
            const detailStrength = 2.0 * scaleFactor;

            await updateStatus("计算风场...");

            const windProfile = new Float32Array(height);
            const numZones = randint(8, 15);
            
            for(let y = 0; y < height; y++) {
                const lat = (y / height) * 2 - 1;
                let wind = Math.cos(lat * Math.PI * numZones);
                wind += Math.exp(-lat*lat * 8) * 1.5;
                wind += (simplex.noise2D(0, lat * 5) - 0.5) * 0.8;
                windProfile[y] = wind;
            }

            const coordsY = Array(height).fill(0).map(() => Array(width));
            const coordsX = Array(height).fill(0).map(() => Array(width));

            for (let y = 0; y < height; y++) {
                if (y % 50 === 0) await updateStatus(`应用风场扭曲... (${Math.round(y/height * 100)}%)`);
                
                const baseWind = windProfile[y];
                for (let x = 0; x < width; x++) {
                    const x_norm = x / width;
                    const y_norm = y / height;
                    const noiseVal = seamless_horizontal_noise(x_norm, y_norm, 15.0, 1.0);
                    const shiftX = (baseWind * 1.0 + noiseVal * 0.1) * shearStrength;
                    const shiftY = noiseVal * detailStrength;
                    coordsX[y][x] = x + shiftX;
                    coordsY[y][x] = y + shiftY;
                }
            }
            
            return mapCoordinates(planetArray, [coordsY, coordsX]);
        }

        async function addGreatStorm(planetArray, palette) {
            const { width, height } = planetArray;
            
            const cy = Math.floor(randint(height * 0.3, height * 0.7));
            const cx = Math.floor(randint(width * 0.2, width * 0.8));

            const stormSize = uniform(height * 0.14, height * 0.22);
            const flattening = uniform(0.6, 0.85);
            const isDarkCore = random() < 0.35;

            const midIndex = Math.floor(palette.length / 2);
            const highlightColor = palette[Math.min(midIndex + 1, palette.length - 1)] || [255, 255, 255];
            const lightCoreColor = [255, 255, 240];
            const darkCoreColor = palette[0].map(c => c * 0.8);

            const coreTargetColor = isDarkCore ? darkCoreColor : lightCoreColor;

            await updateStatus("生成巨型风暴眼...");

            const rangeX = Math.ceil(stormSize * 2.5);
            const rangeY = Math.ceil(stormSize * 2.5 * flattening);
            
            const minY = Math.max(0, Math.floor(cy - rangeY));
            const maxY = Math.min(height, Math.floor(cy + rangeY));
            const minX = Math.max(0, Math.floor(cx - rangeX));
            const maxX = Math.min(width, Math.floor(cx + rangeX));

            const arms = 2;
            const twistFactor = 4.0;

            for (let y = minY; y < maxY; y++) {
                for (let x = minX; x < maxX; x++) {
                    let dx = (x - cx) / stormSize;
                    let dy = (y - cy) / (stormSize * flattening);
                    let r = Math.sqrt(dx*dx + dy*dy);

                    if (r > 2.2) continue;

                    let angle = Math.atan2(dy, dx);

                    // === 核心算法 ===
                    let baseShape = Math.exp(-r * r * 2.0);
                    let spiralPhase = angle * arms + Math.pow(r, 0.7) * twistFactor;
                    let armPattern = (Math.sin(spiralPhase) + 1) / 2;
                    let armStrength = Math.min(1.0, r * 1.2);
                    let pattern = (1 - armStrength) + armStrength * armPattern;
                    let coreIntensity = Math.exp(-r * r * (isDarkCore ? 5.0 : 10.0));
                    
                    let rStorm, gStorm, bStorm;

                    if (isDarkCore) {
                        let mixT = coreIntensity;
                        let rMix = highlightColor[0] * (1 - mixT) + coreTargetColor[0] * mixT;
                        let gMix = highlightColor[1] * (1 - mixT) + coreTargetColor[1] * mixT;
                        let bMix = highlightColor[2] * (1 - mixT) + coreTargetColor[2] * mixT;
                        rStorm = rMix;
                        gStorm = gMix;
                        bStorm = bMix;
                    } else {
                        let rMix = highlightColor[0] * (1 - coreIntensity) + coreTargetColor[0] * coreIntensity;
                        let gMix = highlightColor[1] * (1 - coreIntensity) + coreTargetColor[1] * coreIntensity;
                        let bMix = highlightColor[2] * (1 - coreIntensity) + coreTargetColor[2] * coreIntensity;
                        rStorm = rMix;
                        gStorm = gMix;
                        bStorm = bMix;
                    }

                    let shapeAlpha = 0;
                    if (isDarkCore) {
                        let outerAlpha = baseShape * pattern * 1.2;
                        shapeAlpha = Math.max(outerAlpha, coreIntensity * 0.95);
                    } else {
                        let glowAlpha = (baseShape * pattern * 1.5 + coreIntensity);
                        shapeAlpha = glowAlpha;
                    }

                    let fade = Math.max(0, 1 - r/2.2);
                    let finalAlpha = Math.min(1, shapeAlpha * fade);

                    let safeX = (x % width + width) % width;
                    let idx = (y * width + safeX) * 4;

                    if (idx >= 0 && idx < planetArray.data.length) {
                        let bgR = planetArray.data[idx];
                        let bgG = planetArray.data[idx+1];
                        let bgB = planetArray.data[idx+2];
                        planetArray.data[idx] = bgR * (1-finalAlpha) + rStorm * finalAlpha;
                        planetArray.data[idx+1] = bgG * (1-finalAlpha) + gStorm * finalAlpha;
                        planetArray.data[idx+2] = bgB * (1-finalAlpha) + bStorm * finalAlpha;
                    }
                }
            }
            return planetArray;
        }

        async function addSeamlessStorms(planetArray) {
            const { width, height } = planetArray;
            const num_storms = randint(0, 16);
            const scaleFactor = width / 1024.0;

            let tempArray = planetArray;
            for (let i = 0; i < num_storms; i++) {
                if (i%4===0) await updateStatus("添加小型气旋...");
                const cx = randint(width * 0.25, width * 0.75);
                const cy = randint(0, height - 1);
                const radius = randint(width * 0.08, width * 0.2);
                const strength = uniform(1.5, 4.0) * choice([-1, 1]) * scaleFactor;
                tempArray = swirl(tempArray, cy, cx, strength, radius);
            }
            return tempArray;
        }

        // --- Main Execution ---
        async function generate() {
            generateBtn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = "生成中...";
            downloadLink.classList.add('hidden');
            statusText.textContent = "初始化...";

            try {
                const resolution = resolutionSelect.value;
                const paletteKey = paletteSelect.value;
                const doGreatStorm = greatStormCheckbox.checked;
                const filterColor = filterColorInput.value;

                const WIDTH = resolution === '1k' ? 1024 : 2048;
                const HEIGHT = resolution === '1k' ? 512 : 1024;
                canvas.width = WIDTH;
                canvas.height = HEIGHT;

                const seed = Date.now();
                simplex = new SimplexNoise(String(seed));

                const paletteName = paletteKey === 'random' ? choice(Object.keys(PALETTES)) : paletteKey;
                const palette = PALETTES[paletteName];

                await updateStatus("填充底色...");
                const base_color = palette[0];
                ctx.fillStyle = `rgb(${base_color[0]}, ${base_color[1]}, ${base_color[2]})`;
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
                let planetArray = PixelArray.fromImageData(ctx.getImageData(0, 0, WIDTH, HEIGHT));

                // Pipeline
                planetArray = await addMainBands(planetArray, palette);
                planetArray = await addAtmosphericDetail(planetArray);
                planetArray = await addGlowingJetStreams(planetArray);
                planetArray = await applyFlowDistortion(planetArray);
                planetArray = await addSeamlessStorms(planetArray);
                
                if (doGreatStorm) {
                    planetArray = await addGreatStorm(planetArray, palette);
                }

                if (filterColor && filterColor.toLowerCase() !== '#ffffff') {
                    await updateStatus("应用色彩滤镜...");
                    const [fr, fg, fb] = hexToRgb(filterColor);
                    const frN = fr / 255;
                    const fgN = fg / 255;
                    const fbN = fb / 255;
                    
                    for(let i=0; i<planetArray.data.length; i+=4) {
                        planetArray.data[i]   *= frN;
                        planetArray.data[i+1] *= fgN;
                        planetArray.data[i+2] *= fbN;
                    }
                }
                
                await updateStatus("渲染最终纹理...");
                
                // Clamp values
                for(let i=0; i<planetArray.data.length; i+=4) {
                    planetArray.data[i] = Math.max(0, Math.min(255, planetArray.data[i]));
                    planetArray.data[i+1] = Math.max(0, Math.min(255, planetArray.data[i+1]));
                    planetArray.data[i+2] = Math.max(0, Math.min(255, planetArray.data[i+2]));
                    planetArray.data[i+3] = 255;
                }
                
                ctx.putImageData(planetArray.toImageData(), 0, 0);

                statusText.textContent = "完成";
                downloadLink.href = canvas.toDataURL('image/png');
                downloadLink.download = `gas_giant_${paletteName}_${seed}.png`;
                downloadLink.classList.remove('hidden');

                // --- 3D Update ---
                await updateStatus("更新3D模型...");
                update3DTexture();
                await updateStatus("");

            } catch (error) {
                console.error("An error occurred during texture generation:", error);
                statusText.textContent = "错误!";
            } finally {
                generateBtn.disabled = false;
                spinner.classList.add('hidden');
                btnText.textContent = "生成星球";
            }
        }

        function init() {
            Object.keys(PALETTES).forEach(key => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = key.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                paletteSelect.appendChild(option);
            });
            generateBtn.addEventListener('click', generate);
            atmosphereColorInput.addEventListener('input', () => {
                 if(atmosphereMaterial) {
                     atmosphereMaterial.uniforms.glowColor.value = new THREE.Color(atmosphereColorInput.value);
                 }
            });

            // Initialize 3D Scene immediately
            init3D();
            
            // Generate texture
            generate();
        }

        window.onload = function() {
            init();
        };
    </script>
</body>
