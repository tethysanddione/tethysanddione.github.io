<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理大气渲染器 (带光照阴影版)</title>
    <style>
        :root {
            --bg-color: #1a1e23;
            --panel-bg: #2a2f36;
            --text-color: #e0e6ec;
            --border-color: #404853;
            --accent-color: #00aaff;
            --accent-hover: #0088cc;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
        }
        
        /* 左侧控制面板 */
        .sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
            overflow-y: auto;
            flex-shrink: 0;
        }
        
        h1 {
            font-size: 18px;
            margin: 0 0 10px 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: #fff;
        }
        .desc {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 250px;
            margin-bottom: 20px;
        }
        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: block;
        }
        textarea {
            width: 100%;
            flex: 1;
            background-color: #111315;
            color: #a5b3ce;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            font-family: 'SF Mono', 'Courier New', Courier, monospace;
            font-size: 12px;
            resize: none;
            outline: none;
            box-sizing: border-box;
            line-height: 1.5;
        }
        textarea:focus {
            border-color: var(--accent-color);
        }

        .controls-area {
            background-color: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 5px;
            color: #ccc;
        }
        
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        input[type="file"] {
            font-size: 11px;
            color: #9ca3af;
            width: 100%;
        }
        input[type="file"]::file-selector-button {
            background-color: #3d4a5b;
            color: white;
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            transition: background 0.2s;
        }
        input[type="file"]::file-selector-button:hover {
            background-color: #505d70;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            color: white;
        }
        .btn-random { background-color: #3d4a5b; }
        .btn-random:hover { background-color: #505d70; }
        .btn-reset { background-color: var(--accent-color); }
        .btn-reset:hover { background-color: var(--accent-hover); }

        #canvas-container {
            flex: 1;
            position: relative;
            background-color: #000;
            overflow: hidden;
        }

        .hud {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
            pointer-events: none;
            user-select: none;
        }
        .hud-item {
            background-color: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #ddd;
            border: 1px solid rgba(255,255,255,0.1);
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; }
            #canvas-container { height: 60%; }
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div class="sidebar">
        <div>
            <h1>物理大气渲染器</h1>
            <div class="desc">
                已启用物理光照。上传贴图后，请旋转太阳位置观察昼夜交替、晨昏线以及地表的大气散射效果。
            </div>
        </div>

        <div class="editor-container">
            <label>Atmosphere Configuration (.ssc)</label>
            <textarea id="config-input" spellcheck="false">
Atmosphere
{
    Height 60
    MieScaleHeight 12
    Mie 0.002
    MieAsymmetry -0.92
    Rayleigh [ 0.0026 0.0029 0.0077 ]
}</textarea>
        </div>

        <div class="controls-area">
            <div class="control-group">
                <div class="slider-header">
                    <span>行星表面贴图 (2:1 Rect)</span>
                </div>
                <input type="file" id="texture-input" accept="image/*">
            </div>

            <div class="control-group">
                <div class="slider-header">
                    <span>太阳位置 (时间)</span>
                    <span id="time-display">12.0h</span>
                </div>
                <input type="range" id="sun-slider" min="0" max="3.14159" step="0.01" value="1.57">
            </div>

            <div class="btn-group">
                <button class="btn-random" id="btn-random">🎲 随机生成</button>
                <button class="btn-reset" id="btn-reset">↺ 重置视角</button>
            </div>
        </div>
        
        <div style="margin-top:auto; font-size:11px; color:#666; padding-top:10px;">
            提示: 右键平移，左键旋转，滚轮缩放。<br>
            观察晨昏线（光影交界处）的大气发红效果。
        </div>
    </div>

    <div id="canvas-container">
        <div class="hud">
            <div class="hud-item" id="hud-r">Rayleigh R: -</div>
            <div class="hud-item" id="hud-g">Rayleigh G: -</div>
            <div class="hud-item" id="hud-b">Rayleigh B: -</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==========================================
        // 1. GLSL Shader 代码 (保持核心算法不变)
        // ==========================================

        const atmosphereVertexShader = `
            varying vec3 vNormal;
            varying vec3 vWorldPosition;

            void main() {
                vNormal = normalize(normalMatrix * normal);
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPosition.xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const atmosphereFragmentShader = `
            uniform vec3 uSunPosition;
            uniform vec3 uRayleigh;
            uniform float uMie;
            uniform float uMieDirectionalG;
            uniform float uAtmosphereRadius;
            uniform float uPlanetRadius;
            uniform float uScaleHeightRayleigh;
            uniform float uScaleHeightMie;
            uniform float uSunIntensity;

            varying vec3 vNormal;
            varying vec3 vWorldPosition;

            const float PI = 3.14159265359;
            const int SAMPLES = 16;

            vec2 raySphereIntersect(vec3 ro, vec3 rd, float rad) {
                float b = dot(ro, rd);
                float c = dot(ro, ro) - rad * rad;
                float h = b * b - c;
                if (h < 0.0) return vec2(-1.0);
                h = sqrt(h);
                return vec2(-b - h, -b + h);
            }

            float phaseRayleigh(float cosTheta) {
                return 3.0 / (16.0 * PI) * (1.0 + cosTheta * cosTheta);
            }

            float phaseMie(float cosTheta, float g) {
                float g2 = g * g;
                return 3.0 / (8.0 * PI) * ((1.0 - g2) * (1.0 + cosTheta * cosTheta)) /
                       ((2.0 + g2) * pow(1.0 + g2 - 2.0 * g * cosTheta, 1.5));
            }

            float getOpticalDepth(vec3 start, vec3 dir, float len, float scaleHeight) {
                float opticalDepth = 0.0;
                float stepSize = len / float(SAMPLES);
                vec3 currentPos = start;
                for(int i = 0; i < SAMPLES; i++) {
                    float height = length(currentPos) - uPlanetRadius;
                    height = max(0.0, height);
                    float density = exp(-height / scaleHeight);
                    opticalDepth += density * stepSize;
                    currentPos += dir * stepSize;
                }
                return opticalDepth;
            }

            void main() {
                vec3 viewDirection = normalize(vWorldPosition - cameraPosition);
                vec3 camPos = cameraPosition;
                vec3 rayDir = normalize(vWorldPosition - camPos);

                vec2 atmosIntersect = raySphereIntersect(camPos, rayDir, uAtmosphereRadius);
                if (atmosIntersect.x < 0.0) discard;

                float startDist = 0.0;
                float endDist = 0.0;
                
                bool insideAtmosphere = length(camPos) < uAtmosphereRadius;

                if (insideAtmosphere) {
                    startDist = 0.0;
                    endDist = atmosIntersect.y;
                } else {
                    startDist = atmosIntersect.x;
                    endDist = atmosIntersect.y;
                }

                vec2 planetIntersect = raySphereIntersect(camPos, rayDir, uPlanetRadius);
                if (planetIntersect.x > 0.0) {
                    endDist = min(endDist, planetIntersect.x);
                }
                
                float segmentLength = endDist - startDist;
                if (segmentLength <= 0.0) discard;

                float stepSize = segmentLength / float(SAMPLES);
                vec3 currentPos = camPos + rayDir * startDist;
                
                vec3 totalRayleigh = vec3(0.0);
                vec3 totalMie = vec3(0.0);
                
                float opticalDepthR = 0.0;
                float opticalDepthM = 0.0;

                vec3 sunDir = normalize(uSunPosition);
                float mu = dot(rayDir, sunDir);

                for(int i = 0; i < SAMPLES; i++) {
                    vec3 samplePos = currentPos + rayDir * (stepSize * 0.5);
                    float sampleHeight = length(samplePos) - uPlanetRadius;
                    if (sampleHeight < 0.0) sampleHeight = 0.0;

                    float densityR = exp(-sampleHeight / uScaleHeightRayleigh) * stepSize;
                    float densityM = exp(-sampleHeight / uScaleHeightMie) * stepSize;
                    
                    opticalDepthR += densityR;
                    opticalDepthM += densityM;

                    vec2 sunRayIntersect = raySphereIntersect(samplePos, sunDir, uAtmosphereRadius);
                    // 简单的阴影检查：如果向着太阳的方向会穿过地球，则该点在阴影中 (Atmosphere Self-Shadowing)
                    // 注意：这只是针对大气的自阴影。
                    float distToSpace = sunRayIntersect.y;
                    
                    float sunRayOpticalDepthR = getOpticalDepth(samplePos, sunDir, distToSpace, uScaleHeightRayleigh);
                    float sunRayOpticalDepthM = getOpticalDepth(samplePos, sunDir, distToSpace, uScaleHeightMie);
                    
                    vec3 transmittance = exp(-(uRayleigh * (opticalDepthR + sunRayOpticalDepthR) +
                                               uMie * (opticalDepthM + sunRayOpticalDepthM)));
                    
                    totalRayleigh += densityR * transmittance;
                    totalMie += densityM * transmittance;

                    currentPos += rayDir * stepSize;
                }

                vec3 color = (totalRayleigh * uRayleigh * phaseRayleigh(mu) +
                              totalMie * uMie * phaseMie(mu, uMieDirectionalG)) * uSunIntensity;

                // 简单的 Tone Mapping
                color = 1.0 - exp(-color * 4.0);
                color = pow(color, vec3(1.0/2.2));

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const planetVertexShader = `
            varying vec3 vNormal;
            varying vec3 vWorldPosition;
            varying vec2 vUv;

            void main() {
                vUv = uv;
                vNormal = normalize(normalMatrix * normal);
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPosition.xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const planetFragmentShader = `
            uniform sampler2D uMap;
            uniform vec3 uSunPosition;
            uniform vec3 uRayleigh;
            uniform float uMie;
            uniform float uPlanetRadius;
            uniform float uAtmosphereRadius;
            uniform float uScaleHeightRayleigh;
            uniform float uScaleHeightMie;
            uniform float uSunIntensity;

            varying vec3 vNormal;
            varying vec3 vWorldPosition;
            varying vec2 vUv;

            const int SAMPLES = 24;

            // --- 必须补全以下辅助函数 ---
            vec2 raySphereIntersect(vec3 ro, vec3 rd, float rad) {
                float b = dot(ro, rd);
                float c = dot(ro, ro) - rad * rad;
                float h = b * b - c;
                if (h < 0.0) return vec2(-1.0);
                h = sqrt(h);
                return vec2(-b - h, -b + h);
            }

            float getOpticalDepth(vec3 start, vec3 dir, float len, float scaleHeight) {
                float opticalDepth = 0.0;
                float stepSize = len / float(SAMPLES);
                vec3 currentPos = start;
                for(int i = 0; i < SAMPLES; i++) {
                    float height = length(currentPos) - uPlanetRadius;
                    height = max(0.0, height);
                    float density = exp(-height / scaleHeight);
                    opticalDepth += density * stepSize;
                    currentPos += dir * stepSize;
                }
                return opticalDepth;
            }

            void main() {
                vec3 sunDir = normalize(uSunPosition);
                // 1. 获取贴图颜色
                vec4 texColor = texture2D(uMap, vUv);
                
                // 2. 计算地表基础光照 (漫反射)
                float diffuse = max(0.0, dot(vNormal, sunDir));
                
                // 3. 计算阳光穿过大气的衰减 (Mie/Rayleigh 消光)
                vec2 sunAtmosIntersect = raySphereIntersect(vWorldPosition, sunDir, uAtmosphereRadius);
                float odSunR = getOpticalDepth(vWorldPosition, sunDir, sunAtmosIntersect.y, uScaleHeightRayleigh);
                float odSunM = getOpticalDepth(vWorldPosition, sunDir, sunAtmosIntersect.y, uScaleHeightMie);
                vec3 transmittance = exp(-(uRayleigh * odSunR + uMie * odSunM));
                
                // 最终组合
                vec3 finalColor = texColor.rgb * diffuse * transmittance * uSunIntensity * 0.5;

                // Tone Mapping
                finalColor = 1.0 - exp(-finalColor * 2.0);
                gl_FragColor = vec4(pow(finalColor, vec3(1.0/2.2)), 1.0);
            }
        `;
        
        const sunGlowVertexShader = `
            varying vec3 vLocalPosition;
            void main() {
                vLocalPosition = position; // 获取模型局部坐标
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const sunGlowFragmentShader = `
            varying vec3 vLocalPosition;
            void main() {
                // 计算当前像素到球心的归一化距离
                float d = length(vLocalPosition);
                float maxRadius = 150.0;
                
                // 使用反比例函数或更陡峭的指数函数，产生“中心极亮、向外迅速扩散”的效果
                // 这是消除“蛋壳感”的关键，不能用线性减法
                float falloff = pow(1.0 / (d * 0.05 + 1.0), 4.0);
                
                // 核心热力感：越靠近中心颜色越白，边缘变暖色
                vec3 color = mix(vec3(1.0, 0.4, 0.1), vec3(1.0, 1.0, 1.0), falloff);
                
                // 最终光强度
                float intensity = falloff * 4.5;
                
                gl_FragColor = vec4(color * intensity, intensity);
            }
        `;
        // ==========================================
        // 2. 初始化 Three.js 场景
        // ==========================================
        
        const container = document.getElementById('canvas-container');
        const width = container.clientWidth;
        const height = container.clientHeight;
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 10000);
        camera.position.set(0, 0, 320);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        // 开启物理光照计算
        renderer.useLegacyLights = false;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 1000;
        
        // --- 场景灯光 ---
        // 1. 主光源（太阳）
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
        scene.add(sunLight);

        // 2. 环境光（非常弱，模拟星光反射，避免背光面死黑看不清纹理）
        const ambientLight = new THREE.AmbientLight(0x404040, 0.05);
        scene.add(ambientLight);

        // --- 物理对象 ---
        const VISUAL_PLANET_RADIUS = 100.0;
        const REAL_PLANET_RADIUS_KM = 3000.0;
        const KM_TO_UNIT = VISUAL_PLANET_RADIUS / REAL_PLANET_RADIUS_KM;

        // 1. 行星本体
        // 改为 StandardMaterial 以支持光照和阴影
        const planetGeo = new THREE.SphereGeometry(VISUAL_PLANET_RADIUS, 128, 128);
        const sharedUniforms = {
            uSunPosition: { value: new THREE.Vector3(1, 0, 0) },
            uRayleigh: { value: new THREE.Vector3(0.1, 0.1, 0.3) },
            uMie: { value: 0.01 },
            uMieDirectionalG: { value: 0.8 },
            uAtmosphereRadius: { value: 105.0 },
            uPlanetRadius: { value: VISUAL_PLANET_RADIUS },
            uScaleHeightRayleigh: { value: 1.0 },
            uScaleHeightMie: { value: 0.2 },
            uSunIntensity: { value: 12.0 }
        };

        const planetMat = new THREE.ShaderMaterial({
            vertexShader: planetVertexShader,
            fragmentShader: planetFragmentShader, // 注意：请确保将辅助函数合并入此 Shader
            uniforms: {
                ...sharedUniforms,
                uMap: { value: new THREE.Texture() },
            }
        });
        const planet = new THREE.Mesh(planetGeo, planetMat);
        planet.rotation.y = -Math.PI / 2;
        scene.add(planet);

        // 2. 大气层 (Shader Material)
        const atmosGeo = new THREE.SphereGeometry(VISUAL_PLANET_RADIUS * 1.05, 128, 128);
        const atmosMat = new THREE.ShaderMaterial({
            vertexShader: atmosphereVertexShader,
            fragmentShader: atmosphereFragmentShader,
            uniforms: sharedUniforms,
            side: THREE.BackSide, // 渲染球体内表面
            transparent: true,
            blending: THREE.AdditiveBlending, // 叠加模式
            depthWrite: false // 不写入深度，保证能罩在地球表面
        });
        const atmosphere = new THREE.Mesh(atmosGeo, atmosMat);
        // 重要：确保大气层最后渲染，这样它才能叠加在有纹理的地球表面上
        scene.add(atmosphere);
        
        // --- 恒星组 ---
        const sunGroup = new THREE.Group();
        scene.add(sunGroup);

        // 1. 太阳核心：依然用一个小球表示极亮中心
        const sunCore = new THREE.Mesh(
            new THREE.SphereGeometry(22, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        sunGroup.add(sunCore);

        // 2. 辉光层：改用 Sprite。Sprite 永远面向相机，没有正背面，没有阴影
        const canvas = document.createElement('canvas');
        canvas.width = 256; // 提高分辨率减少锯齿
        canvas.height = 256;
        const ctx = canvas.getContext('2d');

        // 明确清除画布，防止旧像素残留
        ctx.clearRect(0, 0, 256, 256);

        const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
        // 使用更自然的色值，并确保边缘 Alpha 绝对为 0
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
        gradient.addColorStop(0.1, 'rgba(255, 255, 220, 0.8)');
        gradient.addColorStop(0.3, 'rgba(255, 180, 50, 0.4)');
        gradient.addColorStop(0.6, 'rgba(255, 80, 0, 0.1)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)'); // 边缘必须彻底透明

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 256, 256);

        const sunTexture = new THREE.CanvasTexture(canvas);
        // 禁用 Mipmapping 和设置过滤，防止采样产生的边缘杂色
        sunTexture.minFilter = THREE.LinearFilter;

        const sunSpriteMat = new THREE.SpriteMaterial({
            map: sunTexture,
            color: 0xffffff,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: true
        });

        const sunSprite = new THREE.Sprite(sunSpriteMat);
        sunSprite.scale.set(450, 450, 1);
        sunGroup.add(sunSprite);

        // ==========================================
        // 3. 逻辑控制
        // ==========================================

        const configInput = document.getElementById('config-input');
        const sunSlider = document.getElementById('sun-slider');
        const textureInput = document.getElementById('texture-input');
        const timeDisplay = document.getElementById('time-display');
        const btnRandom = document.getElementById('btn-random');
        const btnReset = document.getElementById('btn-reset');
        
        const hudR = document.getElementById('hud-r');
        const hudG = document.getElementById('hud-g');
        const hudB = document.getElementById('hud-b');

        const textureLoader = new THREE.TextureLoader();

        function parseConfig(text) {
            const parseColor = (key) => {
                const regex = new RegExp(key + "\\s*\\[\\s*([\\d.\\-]+)\\s+([\\d.\\-]+)\\s+([\\d.\\-]+)\\s*\\]", "i");
                const match = text.match(regex);
                return match ? [parseFloat(match[1]), parseFloat(match[2]), parseFloat(match[3])] : null;
            };
            const parseVal = (key) => {
                const regex = new RegExp(key + "\\s+([\\d.\\-]+)", "i");
                const match = text.match(regex);
                return match ? parseFloat(match[1]) : null;
            };

            return {
                height: parseVal("Height") || 60,
                mieScale: parseVal("MieScaleHeight") || 15,
                mie: parseVal("Mie") || 0.001,
                mieG: parseVal("MieAsymmetry") || -0.9,
                rayleigh: parseColor("Rayleigh") || [0.0026, 0.0029, 0.0077]
            };
        }

        function updateScene() {
            const params = parseConfig(configInput.value);
            const sunAngle = parseFloat(sunSlider.value);
            const sunDist = 2000;
                
                // 计算太阳在 3D 空间的位置 (以 Y轴 为转轴)
                const sunPos = new THREE.Vector3(
                    Math.cos(sunAngle) * sunDist,
                    Math.sin(sunAngle) * 0.2 * sunDist, // 保持微小倾角
                    Math.sin(sunAngle) * sunDist
                );
                
                // 1. 更新视觉模型位置
                sunGroup.position.copy(sunPos);
                
                // 2. 更新 Shader 和灯光所需的单位向量
                const sunDir = sunPos.clone().normalize();
                sharedUniforms.uSunPosition.value.copy(sunDir);
                sunLight.position.copy(sunDir).multiplyScalar(sunDist);
                
            hudR.textContent = `Rayleigh R: ${params.rayleigh[0]}`;
            hudG.textContent = `Rayleigh G: ${params.rayleigh[1]}`;
            hudB.textContent = `Rayleigh B: ${params.rayleigh[2]}`;
            timeDisplay.textContent = `${((sunAngle / Math.PI) * 12).toFixed(1)}h`;
            
            const atmosphereThickness = params.height * KM_TO_UNIT;
            const outerRadius = VISUAL_PLANET_RADIUS + atmosphereThickness;
            const meshScale = (outerRadius / VISUAL_PLANET_RADIUS) * 1.001;
            atmosphere.scale.set(meshScale, meshScale, meshScale);
            
            const u = atmosMat.uniforms;
            u.uAtmosphereRadius.value = outerRadius;
            
            u.uRayleigh.value.set(
                params.rayleigh[0] * 40.0,
                params.rayleigh[1] * 40.0,
                params.rayleigh[2] * 40.0
            );
            
            u.uMie.value = params.mie * 40.0;
            u.uMieDirectionalG.value = params.mieG;
            
            const dynamicRayleighH = Math.max(2.0, params.height / 8.0);
            u.uScaleHeightRayleigh.value = dynamicRayleighH * KM_TO_UNIT;
            u.uScaleHeightMie.value = params.mieScale * KM_TO_UNIT;
            
            // --- 计算太阳向量 ---
            const sunVec = new THREE.Vector3(
                Math.cos(sunAngle),
                Math.sin(sunAngle) * 0.2, // 给一点倾角，稍微好看点
                Math.sin(sunAngle)
            ).normalize();

            // 1. 更新 Shader 中的太阳位置
            u.uSunPosition.value.copy(sunVec);

            // 2. 更新 Three.js 场景灯光位置 (用于照亮地表)
            // 放到很远的地方，保证是平行光效果
            sunLight.position.copy(sunVec).multiplyScalar(500);
        }

        function randomize() {
            const r = () => Math.random();
            const rr = (min, max) => min + Math.random() * (max - min);
            
            const txt = `Atmosphere
{
    Height ${Math.floor(rr(50, 150))}
    MieScaleHeight ${Math.floor(rr(5, 15))}
    Mie ${rr(0.001, 0.01).toFixed(4)}
    MieAsymmetry ${rr(-0.99, 0.99).toFixed(2)}
    Rayleigh [ ${rr(0.001, 0.005).toFixed(4)} ${rr(0.001, 0.005).toFixed(4)} ${rr(0.005, 0.02).toFixed(4)} ]
}`;
            configInput.value = txt;
            updateScene();
        }

        // 事件监听
        configInput.addEventListener('input', updateScene);
        sunSlider.addEventListener('input', updateScene);
        
        textureInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            textureLoader.load(url, (texture) => {
                // 设置正确的色彩空间
                texture.colorSpace = THREE.SRGBColorSpace;
                
                // 关键修复点：通过 uniforms 传递纹理
                if (planet.material.uniforms && planet.material.uniforms.uMap) {
                    planet.material.uniforms.uMap.value = texture;
                    planet.material.needsUpdate = true;
                }
            });
        });

        btnRandom.addEventListener('click', randomize);
        btnReset.addEventListener('click', () => {
            controls.reset();
            sunSlider.value = 1.57;
            updateScene();
        });
        
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        });

        updateScene();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

    </script>
</body>
</html>
