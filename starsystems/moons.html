<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卫星系统生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            overscroll-behavior: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <div class="flex flex-col lg:flex-row h-screen">
        <!-- 控制面板 -->
        <div class="lg:w-1/3 p-6 bg-gray-800 shadow-2xl overflow-y-auto">
            <h1 class="text-3xl font-bold mb-6 text-cyan-400">卫星系统生成器</h1>
            
            <div class="space-y-4">
                <div>
                    <label for="planetName" class="block text-sm font-medium text-gray-300">行星名称</label>
                    <input type="text" id="planetName" value="Terra" class="mt-1 block w-full bg-gray-700 border-gray-600 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-cyan-500 focus:border-cyan-500">
                </div>
                <div>
                    <label for="starName" class="block text-sm font-medium text-gray-300">恒星名称</label>
                    <input type="text" id="starName" value="Sol" class="mt-1 block w-full bg-gray-700 border-gray-600 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-cyan-500 focus:border-cyan-500">
                </div>
                <div>
                    <label for="planetMass" class="block text-sm font-medium text-gray-300">行星质量 (地球倍数)</label>
                    <input type="number" id="planetMass" value="1" step="0.1" class="mt-1 block w-full bg-gray-700 border-gray-600 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-cyan-500 focus:border-cyan-500">
                </div>
                <div>
                    <label for="planetRadius" class="block text-sm font-medium text-gray-300">行星半径 (km)</label>
                    <input type="number" id="planetRadius" value="6371" class="mt-1 block w-full bg-gray-700 border-gray-600 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-cyan-500 focus:border-cyan-500">
                </div>
                <div class="flex items-center">
                    <input id="snowLine" type="checkbox" class="h-4 w-4 text-cyan-600 bg-gray-700 border-gray-600 rounded focus:ring-cyan-500">
                    <label for="snowLine" class="ml-2 block text-sm text-gray-300">位于雪线以外</label>
                </div>
            </div>

            <button id="generateBtn" class="mt-8 w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105">
                生成卫星系统
            </button>
            
            <h2 class="text-2xl font-bold mt-8 mb-4 text-cyan-400">摘要</h2>
            <div id="summary" class="mb-4 p-4 bg-gray-700 rounded-lg text-gray-300 space-y-2">
                <p>卫星数量: <span id="satellite-count" class="font-bold text-white">0</span></p>
                <p>最大卫星: <span id="largest-satellite" class="font-bold text-white">N/A</span></p>
            </div>

            <h2 class="text-2xl font-bold mt-4 mb-4 text-cyan-400">生成数据</h2>
            <pre id="output" class="w-full h-80 bg-gray-900 text-sm p-4 rounded-lg overflow-auto whitespace-pre-wrap break-words"></pre>
        </div>

        <!-- 3D 预览 -->
        <div class="flex-1 min-w-0" id="canvas-container">
            <!-- Three.js canvas will be appended here -->
        </div>
    </div>

    <script type="module">
        // --- 全局变量和常量 ---
        const G = 6.67430e-11; // m^3 kg^-1 s^-2
        const EARTH_MASS = 5.972e24; // kg
        const EARTH_RADIUS = 6371e3; // m

        // --- Three.js 初始化 ---
        let scene, camera, renderer, controls;
        const container = document.getElementById('canvas-container');
        let planetMesh, referencePlane, satelliteGroup;

        function initThree() {
            scene = new THREE.Scene();
            
            const aspect = container.clientWidth / container.clientHeight || 1;
            camera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1e12);
            camera.position.set(0, 500000, 1000000);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setClearColor( 0x000000, 0 ); // apha: true and this needed for transparent bg
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
            container.style.background = `radial-gradient(ellipse at center, #1a202c 0%, #000000 70%)`;


            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);

            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function onWindowResize() {
            if (container.clientWidth === 0 || container.clientHeight === 0) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // --- 核心生成逻辑 ---

        // Box-Muller 变换生成正态分布随机数
        function getNormallyDistributedRandom(mean, stddev) {
            let u1 = 0, u2 = 0;
            while (u1 === 0) u1 = Math.random();
            while (u2 === 0) u2 = Math.random();
            const z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
            return z0 * stddev + mean;
        }

        // 生成器主函数
        function generateSystem() {
            const planetName = document.getElementById('planetName').value || 'PlanetX';
            const starName = document.getElementById('starName').value || 'StarY';
            const planetMass = parseFloat(document.getElementById('planetMass').value) * EARTH_MASS;
            const planetRadius = parseFloat(document.getElementById('planetRadius').value) * 1000; // to meters
            const isBeyondSnowLine = document.getElementById('snowLine').checked;

            if (isNaN(planetMass) || isNaN(planetRadius) || planetMass <= 0 || planetRadius <= 0) {
                document.getElementById('output').textContent = "请输入有效的行星参数。";
                return;
            }

            // 1. 计算卫星总质量
            const massExponent = getNormallyDistributedRandom(-1, 0.5);
            const totalSatelliteMassRatio = Math.pow(10, massExponent) / 100;
            let totalSatelliteMass = planetMass * totalSatelliteMassRatio;

            // 2. 确定卫星数量
            const massInEarths = planetMass / EARTH_MASS;
            const meanSatellites = Math.ceil(massInEarths * 0.1);
            const stdDevSatellites = meanSatellites;
            let numSatellites = Math.round(getNormallyDistributedRandom(meanSatellites, stdDevSatellites));
            if (numSatellites < 0) numSatellites = 0;

            // --- 阶段1: 生成所有卫星的基本物理属性 ---
            const satelliteProperties = [];
            let remainingMass = totalSatelliteMass;
            for (let i = 0; i < numSatellites; i++) {
                if (remainingMass <= 0) break;
                const massFraction = (i === numSatellites - 1) ? 1.0 : Math.random() * 0.9;
                const satelliteMass = remainingMass * massFraction;
                remainingMass -= satelliteMass;

                if (satelliteMass < 1e15) continue;

                const density_g_cm3 = isBeyondSnowLine ? 
                    1.21 + Math.random() * (4.84 - 1.21) : 
                    2.76 + Math.random() * (6.25 - 2.76);
                const density_kg_m3 = density_g_cm3 * 1000;
                
                const satelliteRadius = Math.cbrt((3 * satelliteMass) / (4 * Math.PI * density_kg_m3));
                satelliteProperties.push({ mass: satelliteMass, radius: satelliteRadius, density: density_kg_m3 });
            }

            // --- 阶段2: 放置卫星并计算轨道 ---
            let outputText = '';
            const satellitesData = [];
            let largestSatellite = { radius: 0, name: '', mass: 0 };
            
            const planetDensity = planetMass / ((4/3) * Math.PI * Math.pow(planetRadius, 3));
            let lastApoapsis = planetRadius * 2.44*10^-3 * Math.pow(planetDensity / (satelliteProperties[0]?.density || 3000), 1/3) * 1.5; // Start just outside Roche limit
            
            for (let i = 0; i < satelliteProperties.length; i++) {
                const satProp = satelliteProperties[i];
                
                // 计算希尔球半径作为间距参考
                const hillRadius = lastApoapsis * Math.cbrt(satProp.mass / (3 * planetMass));
                const minSma = lastApoapsis + (5 * hillRadius); // 至少5倍希尔球半径的间距
                
                // 在最小距离上增加随机性
                const semiMajorAxis = minSma * (1 + Math.random() * 1.5);
                
                let eccentricity = getNormallyDistributedRandom(0.05, 0.04);
                if (eccentricity < 0) eccentricity = 0;
                if (eccentricity >= 1) eccentricity = 0.9;
                
                lastApoapsis = semiMajorAxis * (1 + eccentricity); // 更新下一个卫星的起始距离
                
                const incStdDev = (satProp.radius < 100000) ? 15 : 3;
                const inclination = getNormallyDistributedRandom(0, incStdDev);

                const period_seconds = 2 * Math.PI * Math.sqrt(Math.pow(semiMajorAxis, 3) / (G * planetMass));
                const period_days = period_seconds / 86400;

                const ascendingNode = Math.random() * 360;
                const argOfPericenter = Math.random() * 360;
                const meanAnomaly = Math.random() * 360;

                const satName = `${planetName}-${i + 1}`;
                const satCode = `${starName}/${satName}`;

                if (satProp.radius > largestSatellite.radius) {
                    largestSatellite = { radius: satProp.radius, name: satName, mass: satProp.mass };
                }

                outputText += `"${satName}" "${satCode}"\n{\n`;
                outputText += `    Texture         "${satName}.*"\n`;
                outputText += `    Mass            ${(satProp.mass / EARTH_MASS).toExponential(5)}\n`;
                outputText += `    Radius          ${(satProp.radius / 1000).toFixed(2)}\n\n`;
                outputText += `    EllipticalOrbit\n    {\n`;
                outputText += `        Period          ${period_days.toFixed(4)}\n`;
                outputText += `        SemiMajorAxis   ${semiMajorAxis.toFixed(0)}\n`;
                outputText += `        Eccentricity    ${eccentricity.toFixed(4)}\n`;
                outputText += `        Inclination     ${inclination.toFixed(2)}\n`;
                outputText += `        AscendingNode   ${ascendingNode.toFixed(5)}\n`;
                outputText += `        ArgOfPericenter ${argOfPericenter.toFixed(5)}\n`;
                outputText += `        MeanAnomaly     ${meanAnomaly.toFixed(2)}\n`;
                outputText += `    }\n}\n\n`;

                satellitesData.push({
                    radius: satProp.radius, semiMajorAxis, eccentricity, inclination, 
                    ascendingNode, argOfPericenter
                });
            }

            document.getElementById('output').textContent = outputText || "未生成卫星（参数可能导致卫星过少或过小）。";
            updateVisualization({ radius: planetRadius }, satellitesData);
            
            const satelliteCountEl = document.getElementById('satellite-count');
            const largestSatelliteEl = document.getElementById('largest-satellite');

            satelliteCountEl.textContent = satellitesData.length;

            if (satellitesData.length > 0) {
                const largestInfo = `${largestSatellite.name} (半径: ${(largestSatellite.radius / 1000).toFixed(0)} km, 质量: ${(largestSatellite.mass / EARTH_MASS).toExponential(2)} 地球质量)`;
                largestSatelliteEl.textContent = largestInfo;
            } else {
                largestSatelliteEl.textContent = 'N/A';
            }
        }
        
        // --- 可视化更新 ---

        function createCheckerboardTexture(size = 128, squares = 8) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const context = canvas.getContext('2d');
            const squareSize = size / squares;

            for (let i = 0; i < squares; i++) {
                for (let j = 0; j < squares; j++) {
                    if ((i + j) % 2 === 0) {
                        context.fillStyle = 'rgba(0, 255, 255, 0.15)'; // Cyan with opacity
                    } else {
                        context.fillStyle = 'rgba(0, 0, 0, 0)'; // Transparent
                    }
                    context.fillRect(i * squareSize, j * squareSize, squareSize, squareSize);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function updateVisualization(planet, satellites) {
            if (planetMesh) scene.remove(planetMesh);
            if (referencePlane) scene.remove(referencePlane);
            if (satelliteGroup) scene.remove(satelliteGroup);
            
            satelliteGroup = new THREE.Group();
            scene.add(satelliteGroup);

            const planetGeometry = new THREE.SphereGeometry(planet.radius, 64, 32);
            const planetMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x6699ff, 
                roughness: 0.6,
                metalness: 0.2
            });
            planetMesh = new THREE.Mesh(planetGeometry, planetMaterial);
            scene.add(planetMesh);
            
            let maxSma = 0;

            satellites.forEach(sat => {
                const a = sat.semiMajorAxis;
                const e = sat.eccentricity;
                const c = e * a; // distance from center to focus
                const b = Math.sqrt(a*a - c*c); // semi-minor axis

                // The curve is created in the XY plane with the focus at the origin
                const curve = new THREE.EllipseCurve(-c, 0, a, b, 0, 2 * Math.PI, false, 0);
                
                const points = curve.getPoints(200);
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0.6 });
                
                const orbitLine = new THREE.Line(geometry, material);

                const orbitGroup = new THREE.Group();
                orbitGroup.add(orbitLine);

                // Correctly apply orbital elements using matrix transformations, based on the provided example.
                const i_rad = THREE.MathUtils.degToRad(sat.inclination);
                const w_rad = THREE.MathUtils.degToRad(sat.argOfPericenter);
                const o_rad = THREE.MathUtils.degToRad(sat.ascendingNode);
                
                // 1. Argument of Pericenter (rotates orbit in its own plane)
                const rot_w = new THREE.Matrix4().makeRotationZ(w_rad);
                // 2. Inclination (tilts the orbital plane)
                const rot_i = new THREE.Matrix4().makeRotationX(i_rad);
                // 3. Longitude of Ascending Node (rotates the tilted plane)
                const rot_o = new THREE.Matrix4().makeRotationZ(o_rad);

                // Combine the matrices. Order is critical: O * I * W
                const rotationMatrix = new THREE.Matrix4();
                rotationMatrix.multiply(rot_o);
                rotationMatrix.multiply(rot_i);
                rotationMatrix.multiply(rot_w);

                // Apply the final rotation matrix to the orbit group
                orbitGroup.setRotationFromMatrix(rotationMatrix);
                
                satelliteGroup.add(orbitGroup);

                if (a > maxSma) maxSma = a;
            });
            
            const planeSize = maxSma > 0 ? maxSma * 2.2 : planet.radius * 20;
            const texture = createCheckerboardTexture();
            texture.repeat.set(20, 20); // Repeat the texture for a finer grid

            const planeMaterial = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide,
                transparent: true
            });
            const planeGeometry = new THREE.PlaneGeometry(planeSize, planeSize);
            referencePlane = new THREE.Mesh(planeGeometry, planeMaterial);
            referencePlane.rotation.x = 0; // Correctly set to be horizontal (0 inclination)
            scene.add(referencePlane);

            const cameraDistance = maxSma > 0 ? maxSma * 2.5 : planet.radius * 30;
            camera.position.set(0, cameraDistance / 2, cameraDistance);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        // --- 事件监听 ---
        document.getElementById('generateBtn').addEventListener('click', generateSystem);
        
        // --- 初始调用 ---
        initThree();
        generateSystem();
    </script>
</body>
</html>
