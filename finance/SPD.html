<body>

    <div class="container">
        <header>
            <h1>期权SPD分析工具</h1>
            <div class="subtitle">基于期权链数据与蝴蝶价差原理，推导市场隐含概率密度 (State Price Density)</div>
        </header>

        <div class="calculator-layout">
            
            <div class="input-section">
                <div class="card">
                    <h3><i class="fa-solid fa-pen-to-square"></i> 原始数据输入</h3>
                    <div class="input-group">
                        <label>行权价 (Strikes)</label>
                        <textarea id="strikePrices">250, 252.5, 255, 257.5, 260, 262.5, 265, 267.5, 270, 272.5, 275, 277.5, 280, 282.5, 285, 287.5, 290, 292.5, 295, 297.5, 300, 302.5, 305, 307.5, 310, 312.5, 315, 317.5, 320, 322.5, 325, 327.5, 330, 332.5, 335, 337.5, 340, 342.5, 345, 347.5, 350, 352.5, 355, 357.5, 360, 362.5, 365, 367.5, 370, 372.5, 375, 380, 385, 390, 395, 400, 405</textarea>
                    </div>
                    <div class="input-group">
                        <label>Call 价格</label>
                        <textarea id="callPrices">73.69, 65.53, 66.3, 70.32, 62.8, 55, 57.35, 56.34, 53.27, 50.85, 49.07, 43.7, 44.23, 44.0, 41.02, 39.58, 34.85, 32.51, 31.07, 29.0, 26.41, 24.42, 22.58, 20.91, 19.16, 17.65, 15.95, 14.55, 13.2, 11.96, 10.66, 9.58, 8.6, 7.74, 6.85, 6.15, 5.41, 4.83, 4.27, 3.8, 3.35, 2.92, 2.62, 2.33, 2.05, 1.79, 1.6, 1.43, 1.27, 1.14, 1.01, 0.8, 0.65, 0.53, 0.42, 0.35, 0.29</textarea>
                    </div>
                    <div class="input-group">
                        <label>Put 价格</label>
                        <textarea id="putPrices">0.42, 0.48, 0.5, 0.53, 0.59, 0.64, 0.68, 0.78, 0.85, 0.85, 1.08, 1.24, 1.39, 1.6, 1.81, 2.05, 2.38, 2.59, 3.1, 3.55, 4.1, 4.6, 5.25, 6.05, 6.85, 7.6, 8.6, 9.66, 10.8, 12.1, 13.45, 14.75, 16.28, 17.7, 19.45, 20.9, 23.1, 24.45, 26.41, 28.35, 30.93, 31.85, 34.05, 36.25, 38.0, 41.1, 42.5, 45.65, 46.5, 50.95, 53.67, 58.0, 62.9, 69.4, 66.5, 78.17, 80.0</textarea>
                    </div>
                </div>

                <div class="card">
                    <h3><i class="fa-solid fa-sliders"></i> 平滑参数</h3>
                    <div class="input-group" style="margin-bottom: 0;">
                        <label>KDE 带宽 (Bandwidth)</label>
                        <input type="number" id="kdeBandwidth" value="10" placeholder="建议 5-15">
                    </div>
                </div>
                
                <button id="calculateBtn" class="calc-button"><i class="fa-solid fa-wand-magic-sparkles"></i> 生成图像</button>
            </div>

            <div class="output-section">
                <div class="card">
                    <h3><i class="fa-solid fa-chart-area"></i> 概率密度分布 (SPD)</h3>
                    
                    <div class="result-summary" id="resultSummary" style="display: none;">
                        <div class="summary-item">
                            <div class="summary-label">最高概率对应股价</div>
                            <div class="summary-value" id="peakPrice">--</div>
                        </div>
                    </div>

                    <div class="chart-wrapper">
                        <canvas id="spdChart"></canvas>
                    </div>
                    
                    <div class="tutorial-link-container">
                        <a href="tutorial_SPD.html" class="tutorial-link">
                            <i class="fa-solid fa-circle-question"></i>
                            <span>如何解读这张概率密度分布图？</span>
                        </a>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

<script>
    let spdChartInstance = null;

    document.getElementById('calculateBtn').addEventListener('click', function() {
        // 1. 数据解析
        const parseData = (textareaId) => {
            const text = document.getElementById(textareaId).value;
            return text.split(/[\s,]+/).filter(Boolean).map(Number);
        };
        const strikes = parseData('strikePrices');
        const calls = parseData('callPrices');
        const puts = parseData('putPrices');
        const bandwidth = parseFloat(document.getElementById('kdeBandwidth').value) || 10;

        // 2. 校验
        if (strikes.length !== calls.length || strikes.length !== puts.length || strikes.length < 3) {
            alert('数据错误: 行权价、Call、Put 数量必须一致且大于3个。');
            return;
        }

        // 3. 计算 RND (Breeden-Litzenberger)
        const diff = (arr, n = 1) => {
            let result = arr;
            for (let i = 0; i < n; i++) {
                result = result.slice(1).map((val, j) => val - result[j]);
            }
            return result;
        };
        
        const dK = diff(strikes);
        const d2c_dk2_raw = diff(calls, 2);
        const d2p_dk2_raw = diff(puts, 2);

        const d2c_dk2 = d2c_dk2_raw.map((val, i) => val / (dK[i] * dK[i + 1]));
        const d2p_dk2 = d2p_dk2_raw.map((val, i) => val / (dK[i] * dK[i + 1]));

        let rawRnd = [];
        for (let i = 0; i < d2c_dk2.length; i++) {
            // 蝴蝶价差必须非负，取 max(0, call_rnd, put_rnd) 增强稳健性
            rawRnd.push(Math.max(0, d2c_dk2[i], d2p_dk2[i]));
        }
        
        const sumRnd = rawRnd.reduce((a, b) => a + b, 0);
        if(sumRnd === 0) return;
        const normalizedRnd = rawRnd.map(v => v / sumRnd);
        const rndStrikes = strikes.slice(1, -1);

        // 4. KDE 平滑处理
        const gaussianKernel = (u) => (1 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * u * u);
        
        const xVals = [];
        const numPoints = 300; // 增加点数使曲线更平滑
        const minX = Math.min(...strikes);
        const maxX = Math.max(...strikes);
        for (let i = 0; i < numPoints; i++) {
            xVals.push(minX + (maxX - minX) * i / (numPoints - 1));
        }

        const kdeDensity = xVals.map(x => {
            let sum = 0;
            for (let i = 0; i < normalizedRnd.length; i++) {
                sum += normalizedRnd[i] * gaussianKernel((x - rndStrikes[i]) / bandwidth);
            }
            return sum / bandwidth;
        });

        // 归一化 KDE 面积为 1
        let totalArea = 0;
        for (let i = 0; i < xVals.length - 1; i++) {
            totalArea += (kdeDensity[i] + kdeDensity[i + 1]) / 2 * (xVals[i + 1] - xVals[i]);
        }
        if(totalArea === 0) return;
        const normalizedKdeDensity = kdeDensity.map(v => v / totalArea);

        // 5. 寻找峰值 (最高概率对应的股价)
        let maxDensity = -1;
        let maxPrice = 0;
        normalizedKdeDensity.forEach((val, idx) => {
            if (val > maxDensity) {
                maxDensity = val;
                maxPrice = xVals[idx];
            }
        });

        // 更新 UI 摘要
        document.getElementById('resultSummary').style.display = 'flex';
        document.getElementById('peakPrice').innerText = '$' + maxPrice.toFixed(2);


        // 6. 绘图
        const ctx = document.getElementById('spdChart').getContext('2d');
        if (spdChartInstance) {
            spdChartInstance.destroy();
        }

        // Chart.js 全局字体颜色
        Chart.defaults.color = '#a0a5b0';
        Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)';

        spdChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: xVals.map(v => v.toFixed(2)),
                datasets: [
                    {
                        label: 'SPD 概率分布 (KDE平滑)',
                        data: normalizedKdeDensity,
                        borderColor: '#00f2ff',
                        backgroundColor: (context) => {
                            const ctx = context.chart.ctx;
                            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
                            gradient.addColorStop(0, 'rgba(0, 242, 255, 0.4)');
                            gradient.addColorStop(1, 'rgba(0, 242, 255, 0.0)');
                            return gradient;
                        },
                        borderWidth: 3,
                        pointRadius: 0, // 不显示点，只显示线
                        fill: true,
                        tension: 0.4 // 曲线平滑度
                    },
                    {
                        type: 'scatter',
                        label: '原始散点 (Raw Data)',
                        data: rndStrikes.map((strike, i) => ({ x: strike, y: normalizedRnd[i] })),
                        backgroundColor: 'rgba(255, 99, 132, 0.6)',
                        pointRadius: 4,
                        hidden: true // 默认隐藏
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                scales: {
                    x: {
                        type: 'linear',
                        title: { display: true, text: '标的股价 (Underlying Price)', color: '#fff' },
                        ticks: { color: '#a0a5b0' },
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    },
                    y: {
                        title: { display: true, text: '概率密度 (Density)', color: '#fff' },
                        ticks: { display: false }, // 隐藏Y轴具体数值，只看趋势
                        grid: { display: false }
                    }
                },
                plugins: {
                    legend: {
                        labels: { color: '#fff', font: { size: 12 } }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        titleColor: '#00f2ff',
                        callbacks: {
                            label: function(context) {
                                return `密度: ${context.parsed.y.toFixed(4)}`;
                            }
                        }
                    },
                    annotation: { // 如果有chartjs-plugin-annotation可以使用，这里简单用原生逻辑画线
                        // 略
                    }
                }
            }
        });
    });

    // 初始化运行
    document.addEventListener('DOMContentLoaded', () => {
         document.getElementById('calculateBtn').click();
    });
</script>
