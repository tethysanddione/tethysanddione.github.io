<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeowFin - 波动率模型对比 (正态 vs 幂律)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg-color: #0a0b10;
            --card-bg: rgba(30, 35, 45, 0.6);
            --accent-purple: #a259ff;
            --accent-blue: #00f2ff;
            --accent-danger: #ff4d4d;
            --accent-warning: #ffbd2e;
            --text-primary: #ffffff;
            --text-secondary: #a0a5b0;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(0, 0, 0, 0.3);
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
            background-image: radial-gradient(circle at 50% 0%, #1e1a2e 0%, #0a0b10 60%);
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1em;
        }

        /* --- 模式切换器 --- */
        .mode-switcher {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.05);
            padding: 5px;
            border-radius: 30px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .mode-btn {
            padding: 10px 25px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            color: var(--text-secondary);
            background: transparent;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            color: #000;
            background: var(--accent-purple);
            box-shadow: 0 0 15px rgba(162, 89, 255, 0.4);
        }
        
        .mode-btn.active-fat-tail {
            background: var(--accent-danger);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.4);
        }

        /* --- 布局 --- */
        .calculator-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
            align-items: start;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: border-color 0.3s ease;
        }

        .card h3 {
            margin: 0 0 20px 0;
            font-size: 1.1em;
            color: var(--accent-purple);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        /* 输入框样式 */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.9em; color: var(--text-secondary); margin-bottom: 8px; }
        .input-wrapper { position: relative; }
        
        input[type="number"] {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95em;
            box-sizing: border-box;
            font-family: monospace;
        }
        input:focus { outline: none; border-color: var(--accent-purple); }
        .suffix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }

        /* 按钮 */
        .calc-button {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            font-weight: 600;
            color: #fff;
            background: var(--accent-purple);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(162, 89, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }
        .calc-button:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(162, 89, 255, 0.4); }

        /* 结果显示 */
        .result-main {
            text-align: center;
            padding: 30px;
            background: rgba(162, 89, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(162, 89, 255, 0.2);
            margin-bottom: 25px;
        }
        .result-main h2 { margin: 0; font-size: 2.2em; color: var(--accent-purple); }
        .result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 25px; }
        .result-item { text-align: center; padding: 15px; background: rgba(255, 255, 255, 0.03); border-radius: 12px; border: 1px solid var(--border-color); }
        .result-label { font-size: 0.9em; color: var(--text-secondary); margin-bottom: 5px; display: block; }
        .result-value { font-size: 1.2em; font-weight: bold; font-family: monospace; }
        
        .chart-wrapper { position: relative; height: 400px; width: 100%; }
        
        .tip-box {
            font-size: 0.85em;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-top: 15px;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-purple);
        }

        /* 肥尾模式特定样式 */
        body.fat-tail-mode .card h3 { color: var(--accent-danger); }
        body.fat-tail-mode .result-main { border-color: rgba(255, 77, 77, 0.3); background: rgba(255, 77, 77, 0.05); }
        body.fat-tail-mode .result-main h2 { color: var(--accent-danger); }
        body.fat-tail-mode .calc-button { background: var(--accent-danger); box-shadow: 0 0 15px rgba(255, 77, 77, 0.2); }
        body.fat-tail-mode .tip-box { border-left-color: var(--accent-danger); }

        @media (max-width: 1000px) {
            .calculator-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>波动率估计模型</h1>
            <div class="subtitle">选择模型以查看“理论风险”与“真实市场风险”的差异</div>
        </header>

        <div class="mode-switcher">
            <button class="mode-btn active" onclick="setMode('normal')" id="btn-normal">正态分布 (Gaussian)</button>
            <button class="mode-btn" onclick="setMode('fat-tail')" id="btn-fat-tail">幂律分布 (Fat Tail)</button>
        </div>

        <div class="calculator-layout">
            
            <div class="input-section">
                <div class="card">
                    <h3 id="param-title"><i class="fa-solid fa-sliders"></i> 市场参数</h3>
                    
                    <div class="input-group">
                        <label>当前价格</label>
                        <div class="input-wrapper">
                            <input type="number" id="currentPrice" value="65000">
                            <span class="suffix">$</span>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label>年化波动率 (IV)</label>
                        <div class="input-wrapper">
                            <input type="number" id="volatility" value="45">
                            <span class="suffix">%</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>预测时间 (Days)</label>
                        <div class="input-wrapper">
                            <input type="number" id="timeDays" value="30">
                            <span class="suffix">天</span>
                        </div>
                    </div>

                    <div id="fat-tail-params" style="display:none;" class="tip-box">
                        <i class="fa-solid fa-bolt"></i> <b>幂律模式已激活：</b><br>
                        使用赫斯特指数 (Hurst=0.7) 模拟市场的“记忆性”和“趋势性”，并扩大极端值区间至 3σ 以捕捉黑天鹅事件。
                    </div>
                </div>

                <button id="calcBtn" class="calc-button" onclick="runCalculation()">
                    <i class="fa-solid fa-calculator"></i> 计算风险区间
                </button>
            </div>

            <div class="output-section">
                <div class="card">
                    <h3 id="result-title"><i class="fa-solid fa-bullseye"></i> 预测结果</h3>
                    
                    <div class="result-main">
                        <h2 id="rangeResult">--</h2>
                        <p id="rangeLabel">1σ 常态区间 (68% 概率)</p>
                    </div>

                    <div class="result-grid">
                        <div class="result-item">
                            <span class="result-label">上方极值 (<span id="sigmaLabel">2σ</span>)</span>
                            <span class="result-value" id="priceHigh" style="color: #00ff88">--</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">下方极值 (<span id="sigmaLabel2">2σ</span>)</span>
                            <span class="result-value" id="priceLow" style="color: #ff4d4d">--</span>
                        </div>
                    </div>
                    
                    <div class="tip-box" id="adviceText">
                        点击计算以查看结果。
                    </div>

                    <div style="border-top: 1px solid var(--border-color); padding-top: 20px; margin-top: 20px;">
                        <h3 style="border:none; margin-bottom: 15px; font-size: 1em; color: #fff;">
                            <i class="fa-solid fa-chart-area"></i> 波动率锥 (Volatility Cone)
                        </h3>
                        <div class="chart-wrapper">
                            <canvas id="volChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

<script>
    let chartInstance = null;
    let currentMode = 'normal'; // 'normal' or 'fat-tail'

    function setMode(mode) {
        currentMode = mode;
        const body = document.body;
        const btnNormal = document.getElementById('btn-normal');
        const btnFat = document.getElementById('btn-fat-tail');
        const fatParams = document.getElementById('fat-tail-params');
        
        if (mode === 'normal') {
            body.classList.remove('fat-tail-mode');
            btnNormal.classList.add('active');
            btnFat.classList.remove('active', 'active-fat-tail');
            fatParams.style.display = 'none';
        } else {
            body.classList.add('fat-tail-mode');
            btnNormal.classList.remove('active');
            btnFat.classList.add('active-fat-tail');
            fatParams.style.display = 'block';
        }
        runCalculation();
    }

    function runCalculation() {
        const price = parseFloat(document.getElementById('currentPrice').value);
        const volAnnual = parseFloat(document.getElementById('volatility').value) / 100;
        const days = parseFloat(document.getElementById('timeDays').value);
        const TRADING_DAYS = 365;

        if (isNaN(price) || isNaN(volAnnual) || isNaN(days)) return;

        // --- 核心数学逻辑差异 ---
        
        let sigmaMultiplierOuter;  // 外层区间倍数
        let hurstExponent;         // 时间缩放指数
        let adviceHTML = "";

        if (currentMode === 'normal') {
            // 正态分布：标准布朗运动
            sigmaMultiplierOuter = 2.0; // 展示 2σ (95%)
            hurstExponent = 0.5;        // T^0.5
            
            adviceHTML = `<i class='fa-solid fa-circle-check'></i> <b>正态分布视角：</b><br>
            假设价格随机游走。理论上，价格有 95% 的概率会收盘在 <b>2σ</b> 区间内。这适合平稳的市场环境。`;
            
            document.getElementById('rangeLabel').innerText = "1σ 常态区间 (68% 概率)";
            document.getElementById('sigmaLabel').innerText = "2σ (95%)";
            document.getElementById('sigmaLabel2').innerText = "2σ (95%)";

        } else {
            // 幂律分布/肥尾：具有记忆性和跳跃性
            sigmaMultiplierOuter = 3.5; // 展示 3.5σ (极端风险)
            hurstExponent = 0.65;       // T^0.65 (模拟趋势延续性/长尾扩散)
            
            adviceHTML = `<i class='fa-solid fa-radiation'></i> <b>肥尾视角 (Reality)：</b><br>
            金融市场经常发生"不可能"的事件。此模型使用更高的赫斯特指数和 <b>3.5σ</b> 范围来模拟黑天鹅风险。注意外层区间的急剧扩大。`;
            
            document.getElementById('rangeLabel').innerText = "1σ 典型波动 (核心区)";
            document.getElementById('sigmaLabel').innerText = "3.5σ (黑天鹅)";
            document.getElementById('sigmaLabel2').innerText = "3.5σ (黑天鹅)";
        }

        // 计算结束日的数据用于文本显示
        // Time factor = (days/365) ^ H
        const timeFactor = Math.pow(days / TRADING_DAYS, hurstExponent);
        const moveAmount1sigma = price * volAnnual * timeFactor;
        
        // 界面数据
        const low1 = price - moveAmount1sigma;
        const high1 = price + moveAmount1sigma;
        const lowOuter = price - (moveAmount1sigma * sigmaMultiplierOuter);
        const highOuter = price + (moveAmount1sigma * sigmaMultiplierOuter);

        const fmt = (num) => new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(num);

        document.getElementById('rangeResult').textContent = `$${fmt(low1)} - $${fmt(high1)}`;
        document.getElementById('priceHigh').textContent = `$${fmt(highOuter)}`;
        document.getElementById('priceLow').textContent = `$${fmt(lowOuter)}`;
        document.getElementById('adviceText').innerHTML = adviceHTML;

        // --- 图表生成 ---
        generateChart(price, volAnnual, days, TRADING_DAYS, hurstExponent, sigmaMultiplierOuter);
    }

    function generateChart(price, volAnnual, days, totalDays, hurst, outerMult) {
        const ctx = document.getElementById('volChart').getContext('2d');
        const labels = [];
        const dataMean = [];
        const dataUpper1 = [];
        const dataLower1 = [];
        const dataUpperOuter = [];
        const dataLowerOuter = [];

        for (let t = 0; t <= days; t++) {
            labels.push(`Day ${t}`);
            
            // 动态赫斯特指数缩放
            let tVol = volAnnual * Math.pow(t / totalDays, hurst);
            let tMove = price * tVol;

            dataMean.push(price);
            dataUpper1.push(price + tMove);
            dataLower1.push(price - tMove);
            
            // 外层区间
            dataUpperOuter.push(price + (tMove * outerMult));
            dataLowerOuter.push(price - (tMove * outerMult));
        }

        if (chartInstance) chartInstance.destroy();
        Chart.defaults.color = '#a0a5b0';
        Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.05)';

        // 颜色配置
        const colorOuter = currentMode === 'normal' ? 'rgba(162, 89, 255, ' : 'rgba(255, 77, 77, '; // 紫 vs 红
        const colorInner = currentMode === 'normal' ? '#00f2ff' : '#ffbd2e'; // 蓝 vs 橙

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: '基准',
                        data: dataMean,
                        borderColor: 'rgba(255, 255, 255, 0.2)',
                        borderDash: [5, 5],
                        borderWidth: 1,
                        pointRadius: 0
                    },
                    {
                        label: `Outer (${outerMult}σ)`,
                        data: dataUpperOuter,
                        borderColor: colorOuter + '0.5)',
                        backgroundColor: colorOuter + '0.1)',
                        borderWidth: 1,
                        pointRadius: 0,
                        fill: '+1'
                    },
                    {
                        label: 'Inner (1σ)',
                        data: dataUpper1,
                        borderColor: colorInner,
                        backgroundColor: colorOuter + '0.2)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: '-1'
                    },
                    {
                        label: 'Inner Low',
                        data: dataLower1,
                        borderColor: colorInner,
                        backgroundColor: currentMode === 'normal' ? 'rgba(0, 242, 255, 0.1)' : 'rgba(255, 189, 46, 0.1)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: '-1'
                    },
                    {
                        label: `Outer Low`,
                        data: dataLowerOuter,
                        borderColor: colorOuter + '0.5)',
                        backgroundColor: colorOuter + '0.2)',
                        borderWidth: 1,
                        pointRadius: 0,
                        fill: '-1'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                elements: { line: { tension: 0.4 } },
                scales: {
                    y: {
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    },
                    x: { grid: { display: false }, ticks: { maxTicksLimit: 10 } }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label.includes('Low')) return null; // 隐藏重复的Tooltip
                                if (context.parsed.y !== null) {
                                    return label + ': ' + new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits:0 }).format(context.parsed.y);
                                }
                            }
                        }
                    }
                }
            }
        });
    }

    document.addEventListener('DOMContentLoaded', () => setMode('normal'));
</script>
<script src="nav.js" defer></script>
</body>
</html>
