<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeowFin - DCF 现金流估值模型</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MeowFin DCF 现金流折现模型",
      "alternateName": "Discounted Cash Flow Calculator",

      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web Browser",
      "description": "专业的 DCF 估值模型工具。支持自定义 WACC（加权平均资本成本）、永续增长率及未来现金流预测，自动计算美股公司的内在价值与安全边际。",
      "offers": {

      }
    }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f1016;
            --card-bg: rgba(20, 25, 35, 0.7);
            --accent-color: #00f2ff;
            --accent-secondary: #0066ff;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
            --success-color: #00d26a;
            --danger-color: #f93e3e;
            --input-bg: rgba(0, 0, 0, 0.3);
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
            background-image: radial-gradient(circle at 10% 20%, #1a1c29 0%, #0f1016 70%);
        }

        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
        }

        /* --- 头部 --- */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1em;
        }

        /* --- 布局网格 --- */
        .calculator-layout {
            display: grid;
            grid-template-columns: 1fr 1fr 350px; /* 左中右三栏 */
            gap: 25px;
            align-items: start;
        }

        /* --- 卡片通用样式 --- */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card h3 {
            margin: 0 0 20px 0;
            font-size: 1.1em;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- 表单组件 --- */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.9em;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 12px;
            padding-right: 40px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95em;
            font-family: monospace;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.15);
        }

        .unit {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 0.85em;
            pointer-events: none;
        }

        /* --- 按钮 --- */
        .calc-button {
            width: 100%;
            padding: 16px;
            font-size: 1.1em;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(90deg, var(--accent-secondary), var(--accent-color));
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.3);
            margin-top: 10px;
        }

        .calc-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 102, 255, 0.4);
        }

        /* --- 结果面板 (右侧) --- */
        .results-card {
            position: sticky;
            top: 20px;
            border-color: rgba(0, 242, 255, 0.3);
            background: rgba(20, 25, 35, 0.85);
        }

        .result-section-title {
            font-size: 0.85em;
            color: #666;
            margin: 20px 0 10px 0;
            text-transform: uppercase;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95em;
        }

        .result-val {
            font-weight: 600;
            color: #fff;
        }

        .highlight-result {
            text-align: center;
            margin: 25px 0;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .highlight-label {
            font-size: 0.9em;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .highlight-val {
            font-size: 2.2em;
            font-weight: 800;
            color: #fff;
        }

        .upside-bar {
            height: 6px;
            background: #333;
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
            position: relative;
        }
        
        .upside-fill {
            height: 100%;
            width: 0%;
            transition: width 1s ease, background-color 0.3s;
        }

        /* 教程链接 */
        .tutorial-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 0.9em;
            text-decoration: none;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
        }
        .tutorial-link:hover { color: var(--accent-color); }

        /* --- 响应式 --- */
        @media (max-width: 1100px) {
            .calculator-layout {
                grid-template-columns: 1fr 1fr; /* 中等屏幕变为两列 */
            }
            .output-section {
                grid-column: span 2; /* 结果栏横跨底部 */
            }
        }

        @media (max-width: 768px) {
            .calculator-layout {
                grid-template-columns: 1fr; /* 手机变为单列 */
            }
            .output-section {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>DCF 现金流估值模型</h1>
            <div class="subtitle">Discounted Cash Flow：透过现金流与资本成本，洞悉内在价值</div>
        </header>

        <div class="calculator-layout">
            
            <div class="col-left">
                <div class="card">
                    <h3><i class="fa-solid fa-scale-balanced"></i> WACC 资本参数</h3>
                    
                    <div class="input-group">
                        <label>无风险收益率 (Rf)</label>
                        <div class="input-wrapper">
                            <input type="number" id="riskFreeRate" placeholder="默认 2">
                            <span class="unit">%</span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>市场预期收益率 (Rm)</label>
                        <div class="input-wrapper">
                            <input type="number" id="marketReturn" placeholder="默认 13">
                            <span class="unit">%</span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Beta 系数 (β)</label>
                        <div class="input-wrapper">
                            <input type="number" id="beta" value="1.2">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>有效税率 (Tax)</label>
                        <div class="input-wrapper">
                            <input type="number" id="taxRate" value="21">
                            <span class="unit">%</span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3><i class="fa-solid fa-building"></i> 资本结构 (亿)</h3>
                    <div class="input-group">
                        <label>当前市值 (Equity)</label>
                        <div class="input-wrapper">
                            <input type="number" id="marketCap" value="1000">
                            <span class="unit">$</span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>总债务 (Debt)</label>
                        <div class="input-wrapper">
                            <input type="number" id="debtValue" value="200">
                            <span class="unit">$</span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>年度利息支出 (Interest)</label>
                        <div class="input-wrapper">
                            <input type="number" id="interestCost" value="10">
                            <span class="unit">$</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-center">
                <div class="card">
                    <h3><i class="fa-solid fa-money-bill-trend-up"></i> 现金流预测 (亿)</h3>
                    <p style="font-size: 0.85em; color: #666; margin-bottom: 15px;">系统将自动取这三年的平均值作为基准。</p>
                    
                    <div class="input-group">
                        <label>当年自由现金流 (CF TTM)</label>
                        <input type="number" id="cf0" value="50">
                    </div>
                    <div class="input-group">
                        <label>去年自由现金流 (CF T-1)</label>
                        <input type="number" id="cf_1" value="45">
                    </div>
                    <div class="input-group">
                        <label>前年自由现金流 (CF T-2)</label>
                        <input type="number" id="cf_2" value="40">
                    </div>
                </div>

                <div class="card">
                    <h3><i class="fa-solid fa-chart-line"></i> 增长假设</h3>
                    <div class="input-group">
                        <label>未来5年复合增长率 (Growth)</label>
                        <div class="input-wrapper">
                            <input type="number" id="growthRate" value="12">
                            <span class="unit">%</span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>永续增长率 (Terminal)</label>
                        <div class="input-wrapper">
                            <input type="number" id="perpetualGrowthRate" value="2.5" placeholder="< WACC">
                            <span class="unit">%</span>
                        </div>
                    </div>

                    <button id="calculateBtn" class="calc-button">
                        <i class="fa-solid fa-calculator"></i> 开始估值
                    </button>
                </div>
            </div>

            <div class="output-section">
                <div class="card results-card">
                    <h3><i class="fa-solid fa-clipboard-check"></i> 估值报告</h3>
                    
                    <div class="highlight-result">
                        <div class="highlight-label">DCF 内在价值</div>
                        <div class="highlight-val" id="dcfTotalResult">-</div>
                        <div style="font-size: 0.8em; color: #666; margin-top: 5px;">Fair Value Estimate</div>
                    </div>

                    <div class="highlight-result" style="margin-top: -10px; background: transparent; border: none;">
                        <div class="highlight-label">潜在空间 (Upside)</div>
                        <div class="highlight-val" id="upsideResult" style="font-size: 1.8em;">-</div>
                        <div class="upside-bar">
                            <div class="upside-fill" id="upsideBar"></div>
                        </div>
                    </div>

                    <div class="result-section-title">资本成本详情</div>
                    <div class="result-row">
                        <span>WACC (加权成本)</span>
                        <span class="result-val" id="waccResult" style="color: var(--accent-color)">-</span>
                    </div>
                    <div class="result-row">
                        <span>Re (股本成本)</span>
                        <span class="result-val" id="costOfEquityResult">-</span>
                    </div>
                    <div class="result-row">
                        <span>Rd (债务成本)</span>
                        <span class="result-val" id="costOfDebtResult">-</span>
                    </div>

                    <a href="tutorial_DCF.html" class="tutorial-link">
                        <i class="fa-regular fa-circle-question"></i> 如何解读这些指标？
                    </a>
                </div>
            </div>

        </div>
    </div>

<script>
    document.getElementById('calculateBtn').addEventListener('click', function() {
        // 1. 获取输入
        const rf = (parseFloat(document.getElementById('riskFreeRate').value) || 2) / 100;
        const rm = (parseFloat(document.getElementById('marketReturn').value) || 13) / 100;
        const beta = parseFloat(document.getElementById('beta').value) || 0;
        const taxRate = (parseFloat(document.getElementById('taxRate').value) || 0) / 100;
        
        const E = parseFloat(document.getElementById('marketCap').value) || 0;
        const D = parseFloat(document.getElementById('debtValue').value) || 0;
        const interestCost = parseFloat(document.getElementById('interestCost').value) || 0;
        
        const cf0 = parseFloat(document.getElementById('cf0').value) || 0;
        const cf_1 = parseFloat(document.getElementById('cf_1').value) || 0;
        const cf_2 = parseFloat(document.getElementById('cf_2').value) || 0;
        
        const g = (parseFloat(document.getElementById('growthRate').value) || 0) / 100;
        const pg = (parseFloat(document.getElementById('perpetualGrowthRate').value) || 2.5) / 100;
        
        // 2. WACC 计算
        const Re = rf + beta * (rm - rf); // CAPM
        const Rd = (D > 0) ? (interestCost / D) : 0;
        const V = E + D;
        const We = (V > 0) ? (E / V) : 0;
        const Wd = (V > 0) ? (D / V) : 0;
        const WACC = We * Re + Wd * Rd * (1 - taxRate);

        // 3. DCF 计算
        let dcfTotal = 0;
        let upside = 0;

        // WACC 必须大于永续增长率，否则分母为负或无穷
        if (WACC > pg && WACC > 0) {
            // 取三年平均作为基准
            const baseCF = (cf0 + cf_1 + cf_2) / 3;
            let discountedCFsSum = 0;
            let lastCF = baseCF;

            // 折现未来5年
            for (let i = 1; i <= 5; i++) {
                lastCF = lastCF * (1 + g);
                discountedCFsSum += lastCF / Math.pow(1 + WACC, i);
            }

            // 终值 TV (Gordon Growth Model)
            const terminalValue = (lastCF * (1 + pg)) / (WACC - pg);
            const discountedTV = terminalValue / Math.pow(1 + WACC, 5);
            
            dcfTotal = discountedCFsSum + discountedTV;

            if (E > 0) {
                upside = (dcfTotal / E) - 1;
            }
        }
        
        // 4. UI 更新
        const toPercent = (num) => (num * 100).toFixed(2) + '%';
        const toMoney = (num) => num.toLocaleString('en-US', {maximumFractionDigits: 2}) + ' 亿';

        document.getElementById('costOfEquityResult').textContent = toPercent(Re);
        document.getElementById('costOfDebtResult').textContent = toPercent(Rd);
        document.getElementById('waccResult').textContent = toPercent(WACC);

        const dcfEl = document.getElementById('dcfTotalResult');
        const upsideEl = document.getElementById('upsideResult');
        const barEl = document.getElementById('upsideBar');

        if (WACC > pg && WACC > 0) {
            dcfEl.textContent = toMoney(dcfTotal);
            dcfEl.style.color = '#fff';
            
            upsideEl.textContent = (upside > 0 ? '+' : '') + toPercent(upside);
            
            if (upside > 0) {
                upsideEl.style.color = 'var(--success-color)';
                barEl.style.backgroundColor = 'var(--success-color)';
                barEl.style.width = Math.min(upside * 100, 100) + '%'; // 限制最大100%以免溢出
            } else {
                upsideEl.style.color = 'var(--danger-color)';
                barEl.style.backgroundColor = 'var(--danger-color)';
                barEl.style.width = Math.min(Math.abs(upside) * 100, 100) + '%';
            }

        } else {
            dcfEl.textContent = "Error";
            dcfEl.style.color = 'var(--danger-color)';
            upsideEl.textContent = "WACC需 > 永续增长率";
            upsideEl.style.fontSize = "1em";
            barEl.style.width = '0%';
        }
    });

    // 初始化运行一次
    document.addEventListener('DOMContentLoaded', () => {
         document.getElementById('calculateBtn').click();
    });
</script>
